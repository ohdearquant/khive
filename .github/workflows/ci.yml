name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && format('CI replay {0}', inputs.main_sha) || '' }}

on:
  push:
    branches: [main, "integration/**"]
  # Keep pull_request (not pull_request_target): GitHub's first-time-contributor
  # approval gate must remain in front of workflows from external forks.
  # No branches filter: stacked PRs (base = another feature branch) must run CI
  # too — a filtered trigger leaves them mergeStateStatus=CLEAN with zero checks,
  # and a base retarget after the parent merges does not re-fire the workflow.
  pull_request:
  workflow_dispatch:
    inputs:
      main_sha:
        description: "Full 40-hex main commit to replay; empty uses the dispatch revision"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "17 6 * * *"

env:
  CARGO_TERM_COLOR: always

# Main pushes share one group and run the newest commit only: a newer push cancels
# the run in progress and replaces any run still waiting, so a burst of merges
# leaves one main run, at its newest head, and frees the runners the cancelled runs
# held for pull request runs. A cancelled run's commit is contained in the later
# run's tree. While merges keep landing faster than a run completes, main has no
# completed result; it gets one once merges pause, so a merge batch waits for main
# to go green before the next batch starts. Commits without a result of their own
# are attributed by running CI on the commits in between (#3071).
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
#
# PR synchronize events keep the same refs/pull/<number>/merge group and cancel
# superseded work. Integration, nightly and manual runs stay independent.
# REST run status=queued does not mean concurrency-pending: jobs may already be
# running. Inspect concurrency-group membership and jobs when diagnosing a queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # Replay uses the current workflow against historical source, without a temporary ref:
  # gh workflow run ci.yml --ref main -f main_sha=<full-main-commit-sha>
  resolve-revision:
    name: Resolve CI revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
    steps:
      - name: Validate replay input
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPLAY_SHA: ${{ inputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" || -z "$REPLAY_SHA" ]]; then
            printf 'replay=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$REPLAY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "main_sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi
          printf 'replay=true\n' >> "$GITHUB_OUTPUT"
      - name: Checkout trusted revision metadata
        if: steps.request.outputs.replay == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate main ancestry
        if: steps.request.outputs.replay == 'true'
        id: resolve
        env:
          REPLAY_SHA: ${{ inputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          object_type=$(git cat-file -t "$REPLAY_SHA" 2>/dev/null || true)
          if [[ "$object_type" != "commit" ]]; then
            echo "main_sha must identify a commit object" >&2
            exit 1
          fi
          candidate=$(git rev-parse --verify "${REPLAY_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$candidate" refs/remotes/origin/main; then
            echo "main_sha must be reachable from origin/main" >&2
            exit 1
          fi
          printf 'checkout_sha=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016
          {
            printf '### CI replay revision\n\n'
            printf 'Requested: `%s`\n\n' "$REPLAY_SHA"
            printf 'Validated checkout: `%s`\n\n' "$candidate"
            printf 'Main tip: `%s`\n' "$(git rev-parse refs/remotes/origin/main)"
          } >> "$GITHUB_STEP_SUMMARY"

  # A change that touches only Markdown files no code names runs the documentation lane: docs formatting,
  # the ADR lints, the marketplace validator, the data-leak guard and the secret scan. The Rust, Python,
  # web, coverage and portability jobs skip, and the gate accepts those skips only when this job succeeded
  # and reported docs_only=true (scripts/ci-docs-only.sh states the rule). Pull requests compare the merge
  # ref with its base parent. Pushes to main and to integration branches compare with the newest main
  # commit whose CI run concluded successfully, passed the Linux test shard and recorded a full-suite scope
  # (the Record step), so a documentation commit that replaces a waiting run cannot carry an untested code
  # commit past main CI, and a train whose members change only Markdown skips the suites main already
  # passed. Every other event, and any failed lookup, runs the full suite. So does a change to either
  # classifier script (scripts/ci-docs-only.sh, scripts/ci-test-scope.py): neither decides whether its own
  # change is tested.
  #
  # A pull request that is not documentation-only also gets a test scope (ADR-205): `full`, or the crates
  # it changed plus every crate that depends on them. scripts/ci-test-scope.py states the rules.
  changed-paths:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Classify changed paths
    needs: resolve-revision
    runs-on: ubuntu-latest
    # The Scope step fetches a binary and ingests the workspace map. Its own bounds (60 s of path rules, up to
    # ten 120 s downloads, a 300 s ingest) can add up to more than this job's limit; a job that reaches the limit
    # fails, and the gate reads a failed changed-paths job as a red run, never as a pass.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      test_scope: ${{ steps.scope.outputs.test_scope }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integration/')))
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Classify
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A change to either path classifier runs the full suite: the classifier a commit carries never decides
          # whether that commit is tested. A range that cannot be compared counts as such a change.
          classifiers_changed() {
            local changed
            if ! changed=$(git diff --name-only "$1" "$HEAD_SHA" -- scripts/ci-docs-only.sh scripts/ci-test-scope.py); then
              echo "full suite: the path classifiers could not be compared with $1"
              return 0
            fi
            if [[ -n "$changed" ]]; then
              echo "full suite: the change edits a path classifier: ${changed//$'\n'/, }"
              return 0
            fi
            return 1
          }
          docs_only=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git rev-parse --verify "${HEAD_SHA}^1")
            if ! classifiers_changed "$base"; then
              docs_only=$(bash scripts/ci-docs-only.sh "$base" "$HEAD_SHA")
            fi
          elif [[ "$EVENT_NAME" == "push" && ( "$REF" == "refs/heads/main" || "$REF" == refs/heads/integration/* ) ]]; then
            base=""
            runs=""
            # The checkout is one commit deep. The ancestry test below needs main's history, and the
            # comparison reads paths only, so fetch main's commits and trees without file contents.
            # An integration branch's own commits sit between its head and main, so its ref is fetched too.
            # A full-depth checkout fetches every branch and tag, and its time grows with their count.
            # A repository that already holds its history is used as it is.
            history=true
            refspecs=("+refs/heads/main:refs/remotes/origin/main")
            if [[ "$REF" != "refs/heads/main" ]]; then
              refspecs+=("+${REF}:refs/remotes/origin/${REF#refs/heads/}")
            fi
            if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]] \
                && ! git fetch --no-tags --filter=blob:none --unshallow origin "${refspecs[@]}"; then
              history=false
              echo "fetching main's history failed"
            fi
            if [[ "$history" == "true" ]]; then
              runs=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
                --jq '.workflow_runs[] | select(.event == "push" or .event == "schedule") | "\(.id) \(.head_sha) \(.conclusion)"') || runs=""
            fi
            # A tested base is a run that concluded successfully as a whole, passed Linux shard 1, recorded
            # that it ran the full suite (the test-scope-full artifact the Record step below uploads), and
            # is an ancestor of this head (ADR-205 D3a, Amendment 1). A run without the record is skipped.
            while read -r run_id run_sha conclusion; do
              [[ -n "$run_id" ]] || continue
              [[ "$conclusion" == "success" ]] || continue
              shard=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "CI (ubuntu-latest, shard 1/2)" and .conclusion == "success")] | length') || shard=0
              [[ "$shard" -ge 1 ]] || continue
              recorded=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.name == "test-scope-full")] | length') || recorded=0
              [[ "$recorded" -ge 1 ]] || continue
              if git merge-base --is-ancestor "$run_sha" "$HEAD_SHA" 2>/dev/null; then
                base=$run_sha
                break
              fi
            done <<< "$runs"
            if [[ -n "$base" ]]; then
              echo "Compared with $base, the newest main commit with a completed full run"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              if ! classifiers_changed "$base"; then
                docs_only=$(bash scripts/ci-docs-only.sh "$base" "$HEAD_SHA")
              fi
            else
              echo "full suite: no main commit with a completed full run was found"
            fi
          else
            echo "full suite: $EVENT_NAME runs on ${REF} always run every job"
          fi
          if [[ "$docs_only" != "true" ]]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
      # The path rules run first, on the changed paths alone (--paths-only prints `full` or `map`). Only a
      # change to crate source and Markdown reaches the binary: the kkernel debug build that the newest
      # successful push run on main published, which ingests this checkout's map and resolves the changed
      # crates' dependents. This step always writes test_scope and never fails: every error, every timeout
      # and every event other than a pull request or an integration push writes `full`. An integration push
      # compares with the newest fully tested main commit that is its ancestor (the Classify step's base).
      - name: Scope
        id: scope
        if: steps.classify.outputs.docs_only != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TESTED_BASE: ${{ steps.classify.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # A change to either path classifier runs the full suite: the classifier a commit carries never decides
          # whether that commit is tested. A range that cannot be compared counts as such a change.
          classifiers_changed() {
            local changed
            if ! changed=$(git diff --name-only "$1" "$HEAD_SHA" -- scripts/ci-docs-only.sh scripts/ci-test-scope.py); then
              echo "full suite: the path classifiers could not be compared with $1"
              return 0
            fi
            if [[ -n "$changed" ]]; then
              echo "full suite: the change edits a path classifier: ${changed//$'\n'/, }"
              return 0
            fi
            return 1
          }
          test_scope=full
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$(git rev-parse --verify "${HEAD_SHA}^1") || base=""
            [[ -n "$base" ]] || echo "full suite: the merge ref has no base parent"
          elif [[ "$EVENT_NAME" == "push" && "${REF:-}" == refs/heads/integration/* ]]; then
            # An integration push compares with the newest fully tested main commit the Classify step found.
            base="${TESTED_BASE:-}"
            [[ -n "$base" ]] || echo "full suite: no fully tested main commit is an ancestor of this push"
          else
            echo "full suite: $EVENT_NAME runs on ${REF:-an unnamed ref} are never scoped"
          fi
          if [[ -n "$base" ]] && classifiers_changed "$base"; then
            base=""
          fi
          if [[ -n "$base" ]]; then
            mode=$(timeout 60 python3 scripts/ci-test-scope.py "$base" "$HEAD_SHA" --paths-only) || mode=full
            if [[ "$mode" == "map" ]]; then
              binary=""
              runs=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=10" \
                --jq '.workflow_runs[].id') || runs=""
              for run_id in $runs; do
                dir="$RUNNER_TEMP/kkernel-main-$run_id"
                if timeout 120 gh run download "$run_id" -R "$REPOSITORY" -n kkernel-debug-linux -D "$dir" \
                    && [[ -f "$dir/kkernel" ]]; then
                  chmod +x "$dir/kkernel"
                  binary="$dir/kkernel"
                  echo "kkernel from main push run $run_id"
                  break
                fi
              done
              if [[ -z "$binary" ]]; then
                echo "full suite: no successful main push run among the newest 10 published kkernel-debug-linux"
              else
                test_scope=$(timeout 300 python3 scripts/ci-test-scope.py "$base" "$HEAD_SHA" --kkernel "$binary") \
                  || test_scope=full
              fi
            fi
          fi
          if [[ -z "$test_scope" ]]; then
            test_scope=full
          fi
          echo "test_scope=$test_scope" | tee -a "$GITHUB_OUTPUT"
      # ADR-205 D3a: every run other than a pull request's records the scope its suites ran, and the
      # tested-base lookup in the Classify step reads that record. The artifact's name carries the value
      # (test-scope-full, test-scope-scoped or test-scope-docs), so a reader lists names and never
      # downloads. The value follows the expression the test jobs use (an empty scope runs the full
      # suite). A failed upload leaves the run without a record, so the lookup skips it rather than
      # turning the run red.
      - name: Record the test scope
        id: record
        if: github.event_name != 'pull_request'
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          TEST_SCOPE: ${{ steps.scope.outputs.test_scope }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${DOCS_ONLY:-}" == "true" ]]; then
            recorded=docs
          elif [[ "${TEST_SCOPE:-full}" == "full" ]]; then
            recorded=full
          else
            recorded=scoped
          fi
          mkdir -p "$RUNNER_TEMP/test-scope"
          if [[ "$recorded" == "docs" ]]; then
            echo docs > "$RUNNER_TEMP/test-scope/test_scope"
          else
            printf '%s\n' "${TEST_SCOPE:-full}" > "$RUNNER_TEMP/test-scope/test_scope"
          fi
          echo "recorded=$recorded" | tee -a "$GITHUB_OUTPUT"
      - name: Upload the test scope record
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-scope-${{ steps.record.outputs.recorded }}
          path: ${{ runner.temp }}/test-scope/test_scope
          retention-days: 90
          if-no-files-found: error

  # timeout-minutes starts after a runner is assigned; it bounds stuck execution,
  # but GitHub does not apply it while a job is still queued.
  automerge-push-guard:
    name: Auto-merge push guard
    # Run immediately from the synchronize payload. Comparing enabledAt with
    # the push-time PR update makes reruns idempotent and prevents a request
    # deliberately re-armed after review from being disabled by a delayed
    # runner. CI gate depends on this job, so mutation failure is fail-closed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.event.pull_request.auto_merge != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # disablePullRequestAutoMerge needs contents: write in addition to
      # pull-requests: write — with contents: read the mutation is rejected
      # ("Resource not accessible by integration") and, because this job
      # fail-closes into the CI gate, every push to an armed PR turned the
      # gate red even after re-review (first hit: PR #1054, 2026-07-17).
      contents: write
      pull-requests: write
    steps:
      - name: Disable stale auto-merge request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail

          # Re-read current state because the request may have been disabled or
          # deliberately re-armed while this job waited for a runner.
          # shellcheck disable=SC2016
          pr_json="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  id
                  autoMergeRequest { enabledAt }
                }
              }
            }' \
            -f owner="$REPOSITORY_OWNER" \
            -f name="$REPOSITORY_NAME" \
            -F number="$PR_NUMBER")"

          current_enabled_at="$(jq -r '.data.repository.pullRequest.autoMergeRequest.enabledAt // empty' <<<"$pr_json")"
          if [ -z "$current_enabled_at" ]; then
            echo "Auto-merge is already disabled for PR #${PR_NUMBER}."
            exit 0
          fi
          enabled_epoch="$(date --date="$current_enabled_at" +%s)"
          push_epoch="$(date --date="$PUSH_UPDATED_AT" +%s)"
          if [ "$enabled_epoch" -gt "$push_epoch" ]; then
            echo "Auto-merge was re-armed after this push; preserving the reviewed request."
            exit 0
          fi

          pull_request_id="$(jq -r '.data.repository.pullRequest.id' <<<"$pr_json")"
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='mutation($pullRequestId: ID!) {
              disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                pullRequest { number }
              }
            }' \
            -f pullRequestId="$pull_request_id" >/dev/null

          {
            echo "### Auto-merge disabled"
            echo
            echo "PR #${PR_NUMBER} received a new push. Re-review it before arming auto-merge again."
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}CI (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    # 45 left a 4% margin over the macOS shard-1 healthy duration (~43 min),
    # so any slow runner day converted a green run into a timeout cancellation.
    timeout-minutes: 70
    strategy:
      # Every shard runs to completion so one head reports every arm. With
      # fail-fast on, the first red shard cancelled its siblings and the Clippy
      # step on the Linux shard did not run whenever another arm was red first.
      fail-fast: false
      # The workspace test suite is nextest-partitioned 2-way per OS (see the
      # "Workspace tests" step below). Non-partitioned phases run exactly once
      # per OS: forward-deployed checks, Clippy, and channel feature tests run
      # on shard 2, while the release build and its dependent checks remain on
      # shard 1. The split follows measured step durations; dividing the test
      # count alone leaves the complete jobs badly unbalanced.
      #
      # On a pull request CI_SUITE is `macos-pr` for macos-latest, and every
      # macos-pr step is gated `matrix.shard == 1`, so there is no second
      # partition for macOS shard 2 to carry: it runs the one ungated
      # placeholder scan and nothing else, in ~48s, while holding a macOS
      # runner slot whose median queue time is 34.5 minutes against 0.1 for
      # ubuntu. Pull requests therefore enumerate three jobs and leave that
      # slot to a job that tests something. Push, nightly and manually
      # dispatched runs are CI_SUITE == 'full', where macOS shard 2 does carry
      # a real partition, so they keep all four.
      #
      # Pull requests opened from this repository's own `codex/` branches run
      # the two Linux shards only. Their changes are integrated through a later
      # pull request that runs the three-job matrix above, so the macOS lane
      # runs there, and the many draft pull requests on that prefix no longer
      # hold macOS slots that integration runs wait for.
      # Pull requests from this repository's `split/` and `docs/` branches run
      # the two Linux shards only as well. They carry verbatim moves of code
      # between files and documentation changes; the Linux shards test them,
      # and the push to main that lands them runs both macOS shards.
      # The head-repository check keeps the rule to branches of this
      # repository: a pull request from a fork runs the three-job matrix
      # whatever its branch is called.
      #
      # Written as an explicit include list rather than an `exclude` expression
      # so every branch names every job it produces.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && (startsWith(github.head_ref, 'codex/')
            || startsWith(github.head_ref, 'split/')
            || startsWith(github.head_ref, 'docs/'))
          && github.event.pull_request.head.repo.full_name == github.repository
          && '[{"os":"ubuntu-latest","shard":1},{"os":"ubuntu-latest","shard":2}]'
          || github.event_name == 'pull_request'
          && '[{"os":"ubuntu-latest","shard":1},{"os":"ubuntu-latest","shard":2},{"os":"macos-latest","shard":1}]'
          || '[{"os":"ubuntu-latest","shard":1},{"os":"ubuntu-latest","shard":2},{"os":"macos-latest","shard":1},{"os":"macos-latest","shard":2}]') }}
    defaults:
      run:
        working-directory: crates
    env:
      # PRs use a focused macOS portability lane. Push, nightly, and manually
      # dispatched runs retain the full suite on both operating systems.
      CI_SUITE: ${{ github.event_name == 'pull_request' && matrix.os == 'macos-latest' && 'macos-pr' || 'full' }}
      # CI gates do not need full debuginfo. line-tables-only keeps file:line
      # in test backtraces while cutting most of the target-dir and linker
      # footprint that filled the ubuntu runner disk (ENOSPC surfaces as
      # `ld terminated with signal 7 [Bus error]`, e.g. run 28604091732).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # `full`, or the crates this pull request changed plus their dependents (ADR-205); scripts/ci.sh
      # passes them to the test and clippy phases as -p arguments. An unset scope runs the full suite.
      TEST_SCOPE: ${{ needs.changed-paths.outputs.test_scope || 'full' }}
      # The model cache below is load-bearing, not an optimisation: with this
      # set, a phase whose model is missing fails naming the directory instead
      # of fetching from huggingface.co.
      LATTICE_OFFLINE: "1"
    steps:
      # Steps before the checkout cannot use the job's default working directory: `crates` does
      # not exist until the repository is checked out.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - name: Test scope
        run: echo "TEST_SCOPE=$TEST_SCOPE"
      # ubuntu-latest runners start with ~21GB free on /. The workspace's
      # check + clippy + test + release passes exceed that, and ld's mmap'd
      # writes turn ENOSPC into SIGBUS. Purge preinstalled toolchains this
      # repo never uses (Android, .NET, GHC, CodeQL, docker images) to
      # reclaim ~25GB before the build starts.
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Pin the real toolchain bin on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          # Only main writes caches. A pull request's cache is scoped to its
          # own merge ref, so no other pull request can restore it, but it
          # still counts against the repository's cache quota. Pull request
          # saves pushed the total past the quota and evicted main's entries
          # (the macOS entry first), which left later runs compiling every
          # dependency from scratch. Pull requests restore main's cache and
          # save nothing.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Cache key bump: artifacts built with full debuginfo predate the
          # line-tables-only profile; restoring them would defeat the disk cap.
          # Sharded into the key: the shards build different profiles and
          # features (the release build runs on shard 1; Clippy, the
          # forward-deployed checks and the channel feature tests run on
          # shard 2). With one shared key the first shard to finish saved and
          # the other's artifacts never reached the cache, so the release
          # build recompiled every dependency on every run.
          key: line-tables-shard${{ matrix.shard }}
      # EMBEDDING MODEL CACHE. The embedder fetches its weights from
      # huggingface.co the first time it is built. Fetching per run made this
      # workflow depend on a third-party CDN's rate limiter, which on
      # 2026-09-12 answered 429 twelve times in one job and reddened unrelated
      # pull requests. Restore the cache, fill it only on a miss, and then run
      # every test phase with LATTICE_OFFLINE set (see the job env above) so the
      # cache is load-bearing: a phase that would have fetched fails at once,
      # naming the directory it expected, instead of reaching the network.
      #
      # The key carries the locked lattice-inference version because that crate
      # owns both the cache layout and the checksum set the files are verified
      # against, so a version change is the event that can invalidate a cache
      # entry. There is no upstream revision to pin: the crate resolves against
      # the repository's main branch.
      - name: Resolve the embedding model cache key
        id: model-cache-key
        working-directory: ${{ github.workspace }}
        run: |
          version=$(awk '/^name = "lattice-inference"$/{found=1; next} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' crates/Cargo.lock)
          # An empty version would silently produce a key that never matches and
          # a cache that never restores, which reads exactly like a cold runner.
          if [ -z "$version" ]; then
            echo "could not read the locked lattice-inference version from crates/Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved lattice-inference $version"
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.lattice/models
          key: lattice-models-${{ runner.os }}-all-minilm-l6-v2-${{ steps.model-cache-key.outputs.version }}
      - name: Warm the embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: scripts/warm-model-cache.sh all-minilm-l6-v2
      - uses: denoland/setup-deno@v2
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@v5
        if: env.CI_SUITE == 'full' && matrix.shard == 1
      # The identifier-ban contract performs a repo-wide ripgrep scan and
      # fails (rather than skips) when CI lacks rg (#1636). ubuntu-latest does
      # not include it, so provision the instrument in every full-suite shard
      # that runs khive-contract.
      - name: Install khive-contract scan dependency (Linux)
        if: env.CI_SUITE == 'full' && matrix.shard == 1 && runner.os == 'Linux'
        run: ../scripts/ci-install-ripgrep.sh
      - name: Install khive-contract scan dependency (macOS)
        if: env.CI_SUITE == 'full' && matrix.shard == 1 && runner.os == 'macOS'
        run: |
          brew install ripgrep
          rg --version
      # SECURITY ORDERING (#560): the placeholder-stub scan runs before any cargo
      # phase so no PR-controlled build script or proc-macro executes before the
      # guard; it reads the pristine checkout. Keep this step ahead of every cargo
      # step below, and ungated: both suites compile PR-controlled code, so gating
      # the scan to one suite (or one shard) leaves a lane unguarded.
      - name: No-stub placeholder scan (before any cargo)
        run: ../scripts/ci.sh no-stubs-scan
      - name: macOS PR compile check
        if: env.CI_SUITE == 'macos-pr' && matrix.shard == 1
        run: ../scripts/ci.sh macos-pr-check
      - name: macOS PR platform tests
        if: env.CI_SUITE == 'macos-pr' && matrix.shard == 1
        run: ../scripts/ci.sh macos-pr-tests
      - name: Lockfile freshness
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh lockfile
      - name: Forward-deployed crate checks
        if: env.CI_SUITE == 'full' && matrix.shard == 2
        run: ../scripts/ci.sh forward-deployed
      - name: Format, SQL, and ADR lints
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh lint
      - name: No-stub guard
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh no-stubs
      - name: Clippy
        if: env.CI_SUITE == 'full' && matrix.shard == 2
        run: ../scripts/ci.sh clippy
      # Rustdoc is already the separately gated doc-build job below; keep it in
      # ci.sh's local all-mode without paying for duplicate per-OS CI builds.
      - name: Install cargo-nextest
        if: env.CI_SUITE == 'full'
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-nextest
      # Sharded across both matrix.shard values via nextest's count-based
      # partitioning (cargo-nextest's default and simplest partition scheme;
      # hash-based partitioning was considered but count is deterministic
      # across reruns without needing a stored test-name manifest). nextest
      # does not execute doctests, so the dedicated "Workspace doctests" step
      # below covers that slice once per OS (shard 1 only).
      - name: Workspace tests (nextest shard ${{ matrix.shard }}/2)
        if: env.CI_SUITE == 'full'
        env:
          NEXTEST_PARTITION: ${{ matrix.shard }}/2
        run: ../scripts/ci.sh tests
      - name: Workspace doctests
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh tests-doc
      - name: Audit batch with production features
        if: runner.os == 'Linux' && matrix.shard == 2
        run: sh ../scripts/ci-audit-production.sh
      - name: Channel-email feature tests
        if: env.CI_SUITE == 'full' && matrix.shard == 2
        run: ../scripts/ci.sh channel-email
      # Run this 25-repeat gate once per OS on shard 2. It is independent of
      # the workspace test partition, and its placement contributes to the
      # balance of the two complete jobs.
      #
      # It runs 25x per OS on push/nightly/manual full lanes; the macos-pr lane
      # already covers this pair once via macos-pr-tests, which runs khive-mcp's
      # unit tests on macOS for that reason, so the
      # focused portability lane keeps one serial run of the pair (ADR-049
      # Amendment 3). The introducing commit (cad6479dc) left no rationale for
      # the lone ungated condition it originally carried.
      #
      # timeout-minutes: a warm iteration measures ~24s on ubuntu-latest (2
      # tests, serial, plus per-iteration cargo overhead), so 25 iterations
      # need ~10 minutes of test time alone before the initial build. Budget
      # accordingly; a timeout here means the gate ran out of wall clock, not
      # that a recovery flake was caught.
      - name: Daemon recovery flake gate
        if: env.CI_SUITE == 'full' && matrix.shard == 2
        timeout-minutes: 25
        run: ../scripts/ci.sh daemon-recovery-flake
      - name: No-default-features check
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh no-default-features
      - name: Release build
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh release
      - name: Contract tests
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh contract-tests
      - name: Deno tests
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh deno-tests
      - name: Smoke tests
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh smoke-tests
      - name: Vector smoke test
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh vector-smoke
      - name: khive-contract suite
        if: env.CI_SUITE == 'full' && matrix.shard == 1
        run: ../scripts/ci.sh contract-suite
      # The pull-request scope step runs this kkernel to ingest the workspace map (ADR-205 D4). It is the
      # debug build the workspace tests just ran, published only by a main push run whose shard 1 passed
      # every step above, with its debug sections stripped.
      - name: Strip the kkernel binary for pull-request scoping
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CI_SUITE == 'full' && matrix.shard == 1 && runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/kkernel-scope"
          strip --strip-debug -o "$RUNNER_TEMP/kkernel-scope/kkernel" target/debug/kkernel
          ls -l target/debug/kkernel "$RUNNER_TEMP/kkernel-scope/kkernel"
      - name: Publish the kkernel binary for pull-request scoping
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CI_SUITE == 'full' && matrix.shard == 1 && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: kkernel-debug-linux
          path: ${{ runner.temp }}/kkernel-scope/kkernel
          retention-days: 7
          if-no-files-found: error

  khive-py:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Python client tests
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      KKERNEL: ${{ github.workspace }}/crates/target/debug/kkernel
      PYTHONPATH: ${{ github.workspace }}/python
      TMPDIR: /tmp
      # See the model cache steps below: with this set the cache is load-bearing.
      LATTICE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Pin the real toolchain bin on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: line-tables
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # EMBEDDING MODEL CACHE. The embedder fetches its weights from
      # huggingface.co the first time it is built. Fetching per run made this
      # workflow depend on a third-party CDN's rate limiter, which on
      # 2026-09-12 answered 429 twelve times in one job and reddened unrelated
      # pull requests. Restore the cache, fill it only on a miss, and then run
      # every test phase with LATTICE_OFFLINE set (see the job env above) so the
      # cache is load-bearing: a phase that would have fetched fails at once,
      # naming the directory it expected, instead of reaching the network.
      #
      # The key carries the locked lattice-inference version because that crate
      # owns both the cache layout and the checksum set the files are verified
      # against, so a version change is the event that can invalidate a cache
      # entry. There is no upstream revision to pin: the crate resolves against
      # the repository's main branch.
      - name: Resolve the embedding model cache key
        id: model-cache-key
        run: |
          version=$(awk '/^name = "lattice-inference"$/{found=1; next} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' crates/Cargo.lock)
          # An empty version would silently produce a key that never matches and
          # a cache that never restores, which reads exactly like a cold runner.
          if [ -z "$version" ]; then
            echo "could not read the locked lattice-inference version from crates/Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved lattice-inference $version"
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.lattice/models
          key: lattice-models-${{ runner.os }}-all-minilm-l6-v2-${{ steps.model-cache-key.outputs.version }}
      - name: Warm the embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/warm-model-cache.sh all-minilm-l6-v2
      - name: No-stub placeholder scan (before any cargo)
        run: scripts/ci.sh no-stubs-scan
      - name: Build debug kkernel
        run: cargo build --manifest-path crates/Cargo.toml --locked -p kkernel --bin kkernel
      - name: Install dependencies and run Python tests
        # pytest exits nonzero when no tests are collected; no separate floor is needed.
        run: |
          set -o pipefail
          uv run --no-project --with 'pydantic>=2.7' --with 'pytest>=8' --with 'blake3>=1' --with 'httpx>=0.27' --with 'mcp>=1.2,<2' --with 'uvicorn>=0.30' --with 'starlette>=0.37' pytest -rs python/tests 2>&1 | tee "$RUNNER_TEMP/python-tests.txt"
          python3 scripts/ci/python-skip-guard.py "$RUNNER_TEMP/python-tests.txt"

  kg-editor:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}KG Studio (Next.js)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Allow the browser download's four-minute retry budget and the OS
    # dependency install's eight-minute backstop, with eight minutes remaining
    # for setup, build, and showcase tests when both install budgets are spent.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/kg-editor
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/kg-editor/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and interaction tests
        run: npm test
      # Must run before the build: `prebuild` regenerates the browser asset from
      # the canonical golden, so a parity check placed after it reads bytes the
      # build just rewrote and passes unconditionally.
      - name: Showcase asset parity
        run: npm run check:showcase
      - name: Production build
        run: npm run build
      # The install intermittently stalls in a hung mirror download until the
      # job-level timeout cancels the whole run (#2066). Bounding the npx
      # process with timeout(1) is unsound for the apt half: killing the
      # wrapper orphans apt-get with the dpkg lock held and the retry then
      # fails on the lock. Instead, bound stalls where they happen: apt gets
      # transport-level read timeouts and native retries, and only the
      # lock-free browser download is wrapped in timeout-with-retry.
      - name: Bound apt downloads against mirror stalls
        # DPkg::Lock::Timeout bounds the dpkg lock wait INSIDE apt: on expiry
        # apt exits nonzero cleanly without ever holding the lock, so a retry
        # of the apt-backed step below cannot contend with our own orphan.
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\nDPkg::Lock::Timeout "120";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-download-timeouts
          # The timeouts above bound a stalled mirror. They do not bound a
          # mirror that answers promptly with a bad index: that fails
          # `apt-get update` for the whole run, and the retry on the
          # dependency step re-reads the same index, so the retry cannot
          # clear it. The browser OS dependencies come from the Ubuntu
          # archive and Playwright ships its own chromium build, so nothing
          # in this job needs Google's chrome list.
          for f in /etc/apt/sources.list.d/google-chrome.list \
                   /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -e "$f" ]; then sudo mv "$f" "$f.disabled"; fi
          done
          # Print what still points at the chrome repo: empty is the pass, a
          # non-empty line says the rename missed a filename this does not know.
          sudo grep -rl 'dl[.]google[.]com/linux/chrome' /etc/apt/ || true
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/kg-editor/package-lock.json') }}
      - name: Install browser for repository dogfood
        run: timeout 120 npx playwright install chromium || timeout 120 npx playwright install chromium
      - name: Install browser OS dependencies
        # Deliberately NO timeout(1) wrapper: killing the wrapper mid-install
        # orphans apt-get with the dpkg lock held (the unsound pattern the
        # comment above the apt.conf step describes). Both hang classes are
        # bounded inside apt itself: Acquire timeouts for mirror reads,
        # DPkg::Lock::Timeout for lock waits, so a failed first attempt exits
        # cleanly and the retry is lock-safe. The step timeout is the backstop
        # for hangs apt cannot bound (dpkg maintainer scripts); it fails the
        # job while reserving time for the other steps. Slow but progressing
        # package downloads can exceed the former four-minute backstop.
        timeout-minutes: 8
        run: npx playwright install-deps chromium || npx playwright install-deps chromium
      - name: Repository showcase dogfood
        run: npx playwright test

  supply-chain:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Supply-chain (cargo-deny)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      # cargo-deny 0.19.9+ parses CVSS 4.0 entries in the 2026 RustSec DB;
      # 0.18.x fails to load the DB entirely. One pinned binary runs every check
      # class so the supply-chain gate cannot drift between two implementations.
      # The installer action is pinned to an immutable commit SHA (not the mutable
      # @v2 tag), and the next step ASSERTS the resolved version is exactly 0.19.9
      # before gating. In an autonomous-merge model logs are not review: if the
      # installer ever drifts (tag moves, binstall fallback resolves a different
      # build), the assertion fails the job rather than silently gating with the
      # wrong binary.
      - name: Install pinned cargo-deny (0.19.9)
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny 0.19.9 (hard gate)
        run: |
          test "$(cargo-deny --version)" = "cargo-deny 0.19.9"
          cargo deny --manifest-path crates/Cargo.toml --all-features check bans licenses sources advisories

  data-leak-guard:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}JSON/JSONL data-leak guard
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
