  core-only:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Core-only feature set build and tests
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
