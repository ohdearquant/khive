    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      # See the model cache steps below: with this set the cache is load-bearing.
      LATTICE_OFFLINE: "1"
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Pin the real toolchain bin on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The same embedding model cache the ci job restores, under the same key. With
      # LATTICE_OFFLINE set above, a library test that needs the model fails naming
      # the missing directory instead of fetching from huggingface.co.
      - name: Resolve the embedding model cache key
        id: model-cache-key
        working-directory: ${{ github.workspace }}
        run: |
          version=$(awk '/^name = "lattice-inference"$/{found=1; next} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' crates/Cargo.lock)
          # An empty version would silently produce a key that never matches and
          # a cache that never restores, which reads exactly like a cold runner.
          if [ -z "$version" ]; then
            echo "could not read the locked lattice-inference version from crates/Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved lattice-inference $version"
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.lattice/models
          key: lattice-models-${{ runner.os }}-all-minilm-l6-v2-${{ steps.model-cache-key.outputs.version }}
      - name: Warm the embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: scripts/warm-model-cache.sh all-minilm-l6-v2
      - name: Compile every target without the optional packs
        run: cargo check -p kkernel -p khive-mcp --no-default-features --all-targets --locked
      - name: Keep Git's normal dependency graph independent of Exec and Tool
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p khive-pack-git --edges normal --target all --prefix none --format '{p}' > "$RUNNER_TEMP/git-normal-deps.txt"
          awk '{print $1}' "$RUNNER_TEMP/git-normal-deps.txt" > "$RUNNER_TEMP/git-normal-packages.txt"
          grep -Fxq 'khive-pack-git' "$RUNNER_TEMP/git-normal-packages.txt"
          if grep -Ex 'khive-pack-exec|khive-pack-tool' "$RUNNER_TEMP/git-normal-packages.txt"; then
            echo 'Git must not normally depend on Exec or Tool; dev fixtures may use both' >&2
            exit 1
          fi
      - name: Run the library tests without the optional packs
        run: cargo test -p kkernel -p khive-mcp --no-default-features --lib --locked
      # These integration tests assert which packs are linked and selectable. Their
      # feature-off branches are what catch a core crate linking an optional pack.
      - name: Run the pack composition tests without the optional packs
        run: cargo test -p kkernel --no-default-features --locked --test optional_pack_features --test gate_operation_census --test descriptions_are_written_for_callers
      # The default features leave the agent, telemetry and web packs out, so the ci
      # job runs only their feature-off branches. These three steps run the
      # feature-on branches and the suites that need an optional pack.
      - name: Run the library tests with every optional pack
        run: cargo test -p kkernel -p khive-mcp --features pack-agent,pack-telemetry,pack-web --lib --locked
      - name: Run the pack composition tests with every optional pack
        run: cargo test -p kkernel --features pack-agent,pack-telemetry,pack-web --locked --test optional_pack_features --test gate_operation_census --test descriptions_are_written_for_callers --test pack_schema_scope --test pack_metadata_accessors --test mount_fixture --test mounts
      - name: Run the server suites that need an optional pack
        run: cargo test -p khive-mcp --features pack-agent,pack-telemetry,pack-web --locked --test mcp_mount_fixture --test mounts --test telemetry_activation --test web_backend_routing
      # kg-adapters and repo-showcase are off by default, so the ci job runs only the
      # refusal side of kg import and none of the repo commands. This step runs the
      # import adapter and repository showcase suites with both features on.
      - name: Run the kg import adapter and repository showcase suites
        run: cargo test -p kkernel --features kg-adapters,repo-showcase --locked --lib --test kg_import_csv --test kg_import_bibtex --test kg_import_schema --test kg_import_conflicts --test repo_showcase_cli
      # blob-s3 is off by default, so the ci job runs only the refusal side of an S3
      # store configuration, and the MinIO job runs only the conformance suite. This
      # step runs the S3 store, configuration and server library tests.
      - name: Run the S3 blob store library tests
        run: cargo test -p khive-db -p khive-runtime -p khive-mcp --features blob-s3 --locked --lib

      - name: Check each optional pack independently
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          for feature in pack-agent pack-telemetry pack-web pack-formal pack-moodboard; do
            started=$SECONDS
            if cargo check -p kkernel --no-default-features --features "$feature" --locked; then
              result=passed
            else
              result=failed
              status=1
            fi
            printf '%s: %s (%s seconds)\n' "$feature" "$result" "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

  check-windows:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Windows compile check
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 0.5.0 release blocker: khive-runtime/khive-mcp's daemon subsystem must
      # compile on x86_64-pc-windows-msvc (the npm package's Windows target).
      # Not (yet) a required check in branch protection — plain `cargo check`
      # (no --all-targets) keeps this fast while the Windows lane is new;
      # widen once it has proven stable.
      - name: cargo check --workspace (Windows)
        run: cargo check --workspace
      # #1335: the walpin sidecar's real Windows FFI paths (open/ACL/rename/
      # delete/mtime touch) previously had no executable coverage — a
      # refactor could compile and pass this job without ever running them.
      # The substring filter selects any test whose full path contains `walpin`,
      # including tests outside the `walpin` module; it is not the full suite.
      # Keep this still-new lane fast; widen alongside the `cargo check` step above.
      - name: khive-db walpin Windows FFI tests
        shell: bash
        run: |
          # Floor 1 detects empty selection without pinning the suite size.
          cargo test -p khive-db --lib walpin 2>&1 | tee "$RUNNER_TEMP/walpin.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/walpin.log" 1
      # ADR-160 Phase 1: compile-only coverage cannot validate the Windows
      # no-reparse, handle-pinned bounded blob read. Keep this lane focused on
      # one normal-path test until the broader Windows suite is affordable.
      - name: khive-db bounded blob read Windows test
        shell: bash
        run: |
          # Floor 1 detects empty selection without pinning the suite size.
          cargo test -p khive-db --lib bounded_verified_get_accepts_exact_and_portable_maximum_limits 2>&1 | tee "$RUNNER_TEMP/bounded_verified_get_accepts_exact_and_portable_maximum_limits.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/bounded_verified_get_accepts_exact_and_portable_maximum_limits.log" 1
      - name: khive-mcp Windows database alias identity
        shell: bash
        run: |
          cargo test -p khive-mcp --lib windows_backend_alias_snapshot_rejects_same_path_replacement 2>&1 | tee "$RUNNER_TEMP/windows-backend-alias-identity.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/windows-backend-alias-identity.log" 1
      - name: khive-db Windows legacy reader file identity
        shell: bash
        run: |
          cargo test -p khive-db --lib windows_read_only_legacy_reader_rejects_different_opened_file_identity 2>&1 | tee "$RUNNER_TEMP/windows-legacy-reader-identity.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/windows-legacy-reader-identity.log" 1
      # #5722: a code-map pool's post-open identity check asks the custom VFS for the native
      # handle; only a Windows run exercises that file control.
      - name: khive-db Windows code-map handle identity
        shell: bash
        run: |
          cargo test -p khive-db --lib windows_code_map_pool_reports_retained_main_identity 2>&1 | tee "$RUNNER_TEMP/windows-code-map-handle-identity.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/windows-code-map-handle-identity.log" 1
      - name: khive-db Windows handle lock mechanism
        shell: bash
        run: |
          cargo test -p khive-db --test lock_mechanism_probe windows::windows_handle_interaction_does_not_release_another_handles_lock -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/lock-mechanism-windows-handle.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/lock-mechanism-windows-handle.log" 1
      - name: khive-db Windows stale-path lock mechanism
        shell: bash
        run: |
          cargo test -p khive-db --test lock_mechanism_probe stale_path::stale_path_truncate_after_rename_changes_the_replacement_while_original_lock_survives -- --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/lock-mechanism-stale-path.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/lock-mechanism-stale-path.log" 1
      # #2149: exercise real Windows sharing/reparse semantics and Git's
      # consumption of the pinned path; a compile check cannot prove either.
      - name: khive-pack-git Windows cache slot pins
        shell: bash
        run: |
          cargo test -p khive-pack-git --lib issue2149_windows_ 2>&1 | tee "$RUNNER_TEMP/issue2149-windows.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/issue2149-windows.log" 1
      - name: khive-pack-code Clippy Windows path test
        shell: bash
        run: |
          cargo test -p khive-pack-code --test clippy_adapter windows_drive_relative_and_stream_paths_are_refused 2>&1 | tee "$RUNNER_TEMP/clippy-windows-paths.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/clippy-windows-paths.log" 1
      - name: khive-pack-session Windows mirror source checks
        shell: bash
        run: |
          cargo test -p khive-pack-session --lib mirror_windows_ 2>&1 | tee "$RUNNER_TEMP/mirror-windows.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/mirror-windows.log" 1

  coverage-measurement:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Coverage measurement
    needs: [resolve-revision, changed-paths]
    # A scoped pull request skips coverage: a number over a subset is not comparable with the baseline
    # (ADR-205 D5). Every run on main keeps it.
    if: needs.changed-paths.outputs.docs_only != 'true' && (needs.changed-paths.outputs.test_scope == 'full' || needs.changed-paths.outputs.test_scope == '')
    runs-on: ubuntu-latest
    # The measuring step carries its own budget below. A job-level timeout
    # cancels the job, and a cancelled job is neither success nor skipped, so
    # the gate would read the timeout as a cancellation while the
    # no-measurement step never ran and never reported why. This job-level
    # value only bounds setup around the step, so it stays above it.
    timeout-minutes: 75
    outputs:
      available: ${{ steps.compute_coverage.outcome == 'success' }}
      current: ${{ steps.compute_coverage.outputs.current }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # See the model cache steps below: with this set the cache is load-bearing.
      LATTICE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      # `cargo llvm-cov --workspace` is the disk-heaviest command in CI: it
      # instruments every crate and emits per-object profraw files on top of the
      # normal target dir, overflowing the ubuntu runner's ~21GB and surfacing as
      # `No space left on device`. The matrix `ci` job already purges the unused
      # preinstalled toolchains to reclaim ~25GB; this gate needs the same purge.
      - name: Free runner disk (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: false
      # Pinned to a commit SHA, not the mutable @v2 tag (same rationale as the
      # #215 cargo-deny installer pin): a required gate's tooling must not drift.
      - uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov
      # EMBEDDING MODEL CACHE. The embedder fetches its weights from
      # huggingface.co the first time it is built. Fetching per run made this
      # workflow depend on a third-party CDN's rate limiter, which on
      # 2026-09-12 answered 429 twelve times in one job and reddened unrelated
      # pull requests. Restore the cache, fill it only on a miss, and then run
      # every test phase with LATTICE_OFFLINE set (see the job env above) so the
      # cache is load-bearing: a phase that would have fetched fails at once,
      # naming the directory it expected, instead of reaching the network.
      #
      # The key carries the locked lattice-inference version because that crate
      # owns both the cache layout and the checksum set the files are verified
      # against, so a version change is the event that can invalidate a cache
      # entry. There is no upstream revision to pin: the crate resolves against
      # the repository's main branch.
      - name: Resolve the embedding model cache key
        id: model-cache-key
        run: |
          version=$(awk '/^name = "lattice-inference"$/{found=1; next} found && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' crates/Cargo.lock)
          # An empty version would silently produce a key that never matches and
          # a cache that never restores, which reads exactly like a cold runner.
          if [ -z "$version" ]; then
            echo "could not read the locked lattice-inference version from crates/Cargo.lock" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved lattice-inference $version"
      - name: Restore the embedding model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/.lattice/models
          key: lattice-models-${{ runner.os }}-all-minilm-l6-v2-${{ steps.model-cache-key.outputs.version }}
      - name: Warm the embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: scripts/warm-model-cache.sh all-minilm-l6-v2
      - name: Compute coverage
        id: compute_coverage
        continue-on-error: true
        # continue-on-error keeps this step from ending the job at once, so the
        # step below can say what happened in the run summary. The job still
        # fails: a step timeout is a step failure, and the measurement is what
        # the ratchet needs, so an unfinished measurement is a red gate rather
        # than a skipped one.
        #
        # THE BUDGET IS SET FROM A MEASUREMENT, NOT FROM A ROUND NUMBER. The
        # original completed measurement was 29m15s, with a 1.37x margin giving
        # 40 minutes. Recent successful Compute coverage runs reached 39 minutes
        # (#3808), and a 40-minute run was cut just after producing its coverage
        # value. Preserve that margin against the slower successful measurement:
        # ceil(39 x 1.37) = ceil(53.43) = 54 minutes.
        #
        # A miss is a red required check rather than a silent skip. The step
        # must still expire before the 75-minute job budget so the reporting and
        # failing steps below can run; the job continues to bound genuine hangs.
        timeout-minutes: 54
        working-directory: crates
        # Keep #705's instrumented replay-test margin local to that test.
        # A global checkout override made unrelated recall tests wait 300s
        # under contention (#2367), consuming the measurement budget.
        env:
          KHIVE_TEST_REPLAY_CHECKOUT_TIMEOUT_SECS: "300"
        run: |
          # Extract TOTAL *line* coverage from the structured JSON export, not by
          # column position. In `--summary-only` text the TOTAL row has Regions%
          # in field 4 and Lines% in field 10, so the prior `awk '{print $4}'`
          # silently gated on REGION coverage while logs claimed line coverage.
          # `.data[0].totals.lines.percent` is unambiguous and format-stable.
          # Observing profdata must not turn a coverage failure into success.
          # Older replay checkouts may not have the diagnostic helper.
          HELPER="$GITHUB_WORKSPACE/scripts/coverage-profile-diagnostics.py"
          if [[ -x "$HELPER" ]] && \
             DIAGNOSTICS=$(mktemp -d "$RUNNER_TEMP/coverage-profiles.XXXXXX") && \
             RUST_LIBDIR=$(rustc --print target-libdir); then
            export COVERAGE_PROFILE_DIAGNOSTICS="$DIAGNOSTICS"
            export COVERAGE_PROFILE_DIAGNOSTICS_MODE=forward
            export COVERAGE_REAL_PROFDATA="${LLVM_PROFDATA-$RUST_LIBDIR/../bin/llvm-profdata}"
            PROFILE_TARGET="${CARGO_LLVM_COV_TARGET_DIR-${CARGO_TARGET_DIR-$PWD/target}/llvm-cov-target}"
            printf 'profile_diagnostics=%s\n' "$DIAGNOSTICS" >> "$GITHUB_OUTPUT" || true
            printf 'real_profdata=%s\n' "$COVERAGE_REAL_PROFDATA" >> "$GITHUB_OUTPUT" || true
            printf 'profile_target=%s\n' "$PROFILE_TARGET" >> "$GITHUB_OUTPUT" || true
            export COVERAGE_PROFILE_TARGET="$PROFILE_TARGET"
            # EXIT cleanup cannot change the original status and never signals a PID.
            trap '{ : > "$DIAGNOSTICS/observer.stop"; } 2>/dev/null || true' EXIT
            { : > "$DIAGNOSTICS/observer.requested"; } 2>/dev/null || true
            COVERAGE_PROFILE_DIAGNOSTICS_MODE=observe "$HELPER" </dev/null >/dev/null 2>&1 &
            export LLVM_PROFDATA="$HELPER"
          else
            echo "coverage profile diagnostics unavailable; running the original coverage command" >&2
          fi
          cargo llvm-cov --workspace --summary-only --json > /tmp/cov.json
          CURRENT=$(jq -r '.data[0].totals.lines.percent' /tmp/cov.json)
          echo "Current line coverage: ${CURRENT}%"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
      - name: Collect failed coverage profiles
        if: always() && steps.compute_coverage.outcome == 'failure' && steps.compute_coverage.outputs.profile_diagnostics != ''
        continue-on-error: true
        timeout-minutes: 5
        working-directory: crates
        env:
          COVERAGE_PROFILE_DIAGNOSTICS_MODE: collect
          COVERAGE_PROFILE_DIAGNOSTICS: ${{ steps.compute_coverage.outputs.profile_diagnostics }}
          COVERAGE_REAL_PROFDATA: ${{ steps.compute_coverage.outputs.real_profdata }}
          COVERAGE_PROFILE_TARGET: ${{ steps.compute_coverage.outputs.profile_target }}
        run: ../scripts/coverage-profile-diagnostics.py
      - name: Upload failed coverage profile diagnostics
        if: always() && steps.compute_coverage.outcome == 'failure' && steps.compute_coverage.outputs.profile_diagnostics != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.compute_coverage.outputs.profile_diagnostics }}/profiles.jsonl
            ${{ steps.compute_coverage.outputs.profile_diagnostics }}/merge-stderr.txt
            ${{ steps.compute_coverage.outputs.profile_diagnostics }}/tool-versions.txt
            ${{ steps.compute_coverage.outputs.profile_diagnostics }}/corrupt/*.profraw
          retention-days: 7
          if-no-files-found: warn
      - name: Report unavailable coverage measurement
        if: steps.compute_coverage.outcome != 'success'
        continue-on-error: true
        run: |
          echo "::error title=Coverage measurement unavailable::cargo llvm-cov did not produce a result; the coverage ratchet cannot run."
          {
            echo "### Coverage measurement unavailable"
            echo
            echo "The coverage command failed or ran out of its budget before producing a"
            echo "measurement, so no coverage-regression judgment was made."
          } >> "$GITHUB_STEP_SUMMARY"
      # Without this the job concluded success while producing nothing, the
      # ratchet was skipped for want of an input, and CI gate forgave the skip.
      # Every run then reported a coverage gate that had not judged anything.
      - name: Fail when no measurement was produced
        if: steps.compute_coverage.outcome != 'success'
        run: |
          echo "no coverage measurement was produced, so the ratchet has nothing to judge" >&2
          exit 1

  coverage-ratchet:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Coverage ratchet
    needs: [resolve-revision, coverage-measurement, changed-paths]
    # Missing inputs must produce a named failure, not an unevaluated skipped name.
    if: always() && needs.changed-paths.outputs.docs_only != 'true' && (needs.changed-paths.outputs.test_scope == 'full' || needs.changed-paths.outputs.test_scope == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only gate: fails a PR whose measured line coverage regresses below the
    # committed baseline (coverage-baseline.txt). It does NOT push to main — the
    # baseline is raised only by an explicit PR that edits coverage-baseline.txt,
    # so every change to main (the floor included) goes through the gate wall.
    steps:
      - name: Refuse unavailable coverage input
        if: needs.resolve-revision.result != 'success' || needs.coverage-measurement.result != 'success' || needs.coverage-measurement.outputs.available != 'true'
        run: |
          echo "CI revision validation or coverage measurement is unavailable; no coverage-regression judgment was made." >&2
          exit 1
      - name: Checkout coverage baseline revision
        if: needs.resolve-revision.result == 'success' && needs.coverage-measurement.result == 'success' && needs.coverage-measurement.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - name: Check coverage does not regress
        if: needs.resolve-revision.result == 'success' && needs.coverage-measurement.result == 'success' && needs.coverage-measurement.outputs.available == 'true'
        env:
          CURRENT_COVERAGE: ${{ needs.coverage-measurement.outputs.current }}
        run: |
          BASELINE=$(cat coverage-baseline.txt | tr -d '[:space:]')
          CURRENT="${CURRENT_COVERAGE}"
          echo "Baseline: ${BASELINE}%  Current: ${CURRENT}%"
          # Allow 0.1 percentage-point measurement noise (compiler non-determinism).
          python3 -c "
          import sys
          baseline = float('${BASELINE}')
          current  = float('${CURRENT}')
          epsilon  = 0.1
          if current < baseline - epsilon:
              print(f'FAIL: coverage dropped {baseline:.2f}% -> {current:.2f}%  (epsilon={epsilon}%)')
              sys.exit(1)
          print(f'OK: {current:.2f}% >= {baseline:.2f}% - {epsilon}% threshold')
          "

  # Single aggregate context for branch protection. Requiring this one job
  # (instead of raw matrix job names like "CI (macos-latest)") keeps the
  # required set stable across matrix changes. Only the conditional jobs
  # named in the aggregation below may skip; every other dependency must
  # succeed. Failures and cancellations always fail the gate.
  ci-gate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - resolve-revision
      - changed-paths
      - automerge-push-guard
      - ci
      - khive-py
      - kg-editor
      - supply-chain
      - data-leak-guard
      - secret-scan
      - docs
      - marketplace
      - doc-build
      - dependency-review
      - coverage-measurement
      - coverage-ratchet
      - wasm-parity
      - vamana-portability
      - minio-blob-compat
      - msrv-check
      - core-only
    if: always()
    steps:
      - name: Check aggregated job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # The push guard may skip on run shape. Dependency review
          # completes an explicit no-work step outside PRs; missing coverage
          # inputs fail the ratchet. The lane jobs may skip only when the
          # classifier succeeded and reported docs_only=true. The coverage
          # jobs may also skip when the classifier succeeded with a crate-list
          # test scope (ADR-205 D6). Any other skip fails the gate.
          echo "$NEEDS" | jq -r '"documentation lane: \(.["changed-paths"].result) docs_only=\(.["changed-paths"].outputs.docs_only // "unset")"'
          echo "$NEEDS" | jq -r '"test scope: \(.["changed-paths"].result) test_scope=\(.["changed-paths"].outputs.test_scope // "unset")"'
          bad=$(echo "$NEEDS" | jq -r '
            ["automerge-push-guard"] as $allowed_skips
            | (if .["changed-paths"].result == "success"
                  and .["changed-paths"].outputs.docs_only == "true"
               then ["ci", "khive-py", "kg-editor", "supply-chain", "doc-build",
                     "dependency-review", "coverage-measurement", "coverage-ratchet",
                     "wasm-parity", "vamana-portability", "minio-blob-compat",
                     "msrv-check", "core-only"]
               else [] end) as $docs_lane_skips
            | (.["changed-paths"].outputs.test_scope // "") as $scope
            | (if .["changed-paths"].result == "success"
                  and $scope != "" and ($scope | ascii_downcase) != "full"
               then ["coverage-measurement", "coverage-ratchet"]
               else [] end) as $scoped_skips
            | to_entries[] | .key as $job
            | select(.value.result != "success" and
                (.value.result != "skipped"
                  or (($allowed_skips + $docs_lane_skips + $scoped_skips) | index($job) | not)))
            | .key')
          if [ -n "$bad" ]; then
            echo "Gate failure — jobs not green: $bad"
            exit 1
          fi
          echo "All gated jobs succeeded or are explicitly allowed to skip."
