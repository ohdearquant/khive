        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - name: Scan whole tree for corpus files
        run: bash scripts/check-json-data.sh --all
      - name: Guard fixture test (staged blobs judged from the index)
        run: bash scripts/tests/check-json-data-test.sh
      - name: Cargo hook fixture tests
        run: python3 scripts/tests/test_hook_cargo.py
      - name: Coverage profile forwarder tests
        run: python3 scripts/tests/test_coverage_profile_diagnostics.py
      - name: Local artifact verifier and install target tests
        run: python3 scripts/tests/test_verify_local_artifact.py

  secret-scan:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Secret scan (gitleaks)
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Verify scanner fixture exemptions
        run: |
          command -v gitleaks
          python3 -m unittest scripts.tests.test_gitleaks_config -v
      # Resolve which commits this run judges. A pull_request or push run must
      # judge THE CHANGE, not the repository: with `fetch-depth: 0` and no range,
      # `gitleaks detect` scans every ref in the checkout, so a finding on any
      # branch pushed to the repo turns this job red on every other pull request,
      # with no way to tell from the log which change is actually at fault.
      #
      # THE NARROWING IS ONLY SAFE BECAUSE THE WIDE POPULATION STAYS COVERED:
      # the nightly `schedule` trigger takes no range and still scans every ref,
      # so a credential reachable from any branch is still found within a day.
      # If that scheduled run is ever removed, filtered, or given a range, this
      # narrowing must be reverted in the same change.
      #
      # An integration/train-* branch is created by a single push of a new ref,
      # so its push event carries no `before` commit and would otherwise widen to
      # every ref, which takes most of this job's time budget. Its new commits are
      # exactly the ones not on main; main's own push runs and the nightly scan
      # cover the rest. Every other new branch still widens.
      - name: Resolve scan scope
        id: scope
        env:
          REPLAY_SHA: ${{ needs.resolve-revision.outputs.checkout_sha }}
          PUSH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          range=""
          case "${{ github.event_name }}" in
            workflow_dispatch)
              # Historical replay judges only history reachable from its validated commit.
              range="$REPLAY_SHA"
              ;;
            pull_request)
              # actions/checkout resolves refs/pull/N/merge, whose first parent
              # is the base and whose second parent is the pull request head.
              if base=$(git rev-parse --verify -q 'HEAD^1') \
                 && head=$(git rev-parse --verify -q 'HEAD^2'); then
                range="${base}..${head}"
              fi
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                 && [ "$before" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                range="${before}..${{ github.sha }}"
              else
                case "$PUSH_REF" in
                  refs/heads/integration/train-*)
                    if main=$(git rev-parse --verify -q 'refs/remotes/origin/main^{commit}'); then
                      range="${main}..${{ github.sha }}"
                    fi
                    ;;
                esac
              fi
              ;;
          esac
          # An unresolvable or empty range must widen the scan, never skip it:
          # scanning nothing exits 0 and is indistinguishable from finding
          # nothing, which would make this gate pass by being broken.
          if [ -n "$range" ]; then
            count=$(git rev-list --count "$range")
            echo "commits in scope: $count ($range)"
            if [ "$count" -eq 0 ]; then
              echo "resolved range is empty — widening to every ref"
              range=""
            fi
          else
            echo "no range resolved for event '${{ github.event_name }}' — scanning every ref"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
      # `-v` prints each finding's file, line, commit and rule. Without it the
      # job reports only `leaks found: N`, so every consumer of a red run has to
      # reproduce locally before learning anything. `--redact` keeps the matched
      # value out of the log.
      - name: Scan for credentials
        run: |
          set -euo pipefail
          range="${{ steps.scope.outputs.range }}"
          if [ -n "$range" ]; then
            gitleaks detect --source . --redact --no-banner -v --log-opts="$range"
          else
            gitleaks detect --source . --redact --no-banner -v
          fi

  docs:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Docs lint
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
          # The reference renderer dates each baseline from its commit. A
          # shallow checkout can contain the document but not the baseline commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Benchmark reference renderer tests
        run: python3 -m unittest scripts.tests.test_render_bench_reference -v
      - name: Check benchmark reference blocks
        run: python3 scripts/render-bench-reference.py --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check markdown formatting
        run: scripts/ci.sh docs-fmt
      - name: ADR reference and status lints
        run: scripts/ci.sh adr-lint
      # The repository-wide identifier ban reads Markdown too, and the documentation lane skips the
      # contract suite that holds it, so it runs here on every change.
      - uses: astral-sh/setup-uv@v5
      - name: Install repository scan dependency
        run: scripts/ci-install-ripgrep.sh
      - name: Repository identifier ban
        run: scripts/ci.sh content-sweeps

  marketplace:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Marketplace example validator
    needs: resolve-revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate marketplace SKILL/agent verb examples
        run: python3 marketplace/_validators/check_examples.py

  doc-build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Doc build (-D warnings)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
