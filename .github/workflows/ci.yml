  dependency-review:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}Dependency review
    needs: [resolve-revision, changed-paths]
    # Admit the job so GitHub evaluates its check name even when no PR work applies.
    if: always() && needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declare the read scope the action needs explicitly so the gate does not
    # depend on ambient GITHUB_TOKEN defaults (an org policy could tighten them).
    # No pull-requests:write — comment-summary-in-pr is not enabled.
    permissions:
      contents: read
    steps:
      - name: Refuse unvalidated dependency review revision
        if: needs.resolve-revision.result != 'success'
        run: |
          echo "CI revision validation did not succeed; dependency review did not run." >&2
          exit 1
      - name: Report dependency review not applicable
        if: needs.resolve-revision.result == 'success' && github.event_name != 'pull_request'
        run: |
          echo "Dependency review applies only to pull requests; no dependency comparison was run."
      - name: Checkout dependency review revision
        if: needs.resolve-revision.result == 'success' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - name: Dependency review
        if: needs.resolve-revision.result == 'success' && github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high or critical vulnerabilities only; low/moderate are
          # informational to avoid blocking on transitive noise.
          fail-on-severity: high
          # Mirror the license allow-list from crates/deny.toml so the two
          # gates stay consistent.  GPL/LGPL/AGPL are implicitly denied because
          # they are absent from the allow list.
          allow-licenses: >-
            Apache-2.0, Apache-2.0 WITH LLVM-exception, MIT, ISC, BSD-2-Clause,
            BSD-3-Clause, Unicode-3.0, Zlib, MIT-0, BSL-1.0, 0BSD, CC0-1.0,
            Unlicense, MPL-2.0, CDLA-Permissive-2.0
          # typing-extensions (transitive via anyio/referencing in the
          # khive-contract suite) is PSF-licensed (Python-2.0), a permissive
          # license. dependency-review mis-detects its metadata as containing
          # GPL-1.0-or-later — a known false positive for this package. Scope the
          # exception to exactly this purl so the allow-list above is unchanged
          # for everything else.
          #
          # sqlite-vec is dual-licensed MIT OR Apache-2.0 (both already in the
          # allow-list above), but dependency-review's SPDX parser cannot parse
          # its combined license string and tags it LicenseRef-bad-mitapache-2.0.
          # Our own cargo-deny gate (crates/deny.toml) already accepts it. Once
          # crates/Cargo.lock is committed (#992), the full cargo tree becomes
          # visible to dependency-review permanently, so this scoped exemption is
          # durable infrastructure rather than a temporary workaround.
          allow-dependencies-licenses: pkg:pypi/typing-extensions, pkg:cargo/sqlite-vec

  wasm-parity:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}wasm-parity (khive-changeset)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates
    env:
      WASMTIME_VERSION: v46.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Pinned exact version (same rationale as the cargo-deny/gitleaks pins
      # above): a wasm-parity gate's tooling must not silently drift.
      - name: Cache wasmtime
        id: cache-wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.wasmtime
          key: wasmtime-${{ runner.os }}-${{ runner.arch }}-${{ env.WASMTIME_VERSION }}
      - name: Install wasmtime (pinned)
        if: steps.cache-wasmtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) wasmtime_arch="x86_64" ;;
            ARM64) wasmtime_arch="aarch64" ;;
            *)
              echo "unsupported runner architecture for the wasmtime release asset: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          asset="wasmtime-${WASMTIME_VERSION}-${wasmtime_arch}-linux"
          archive="$RUNNER_TEMP/${asset}.tar.xz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-max-time 300 \
            --output "$archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${asset}.tar.xz"
          mkdir -p "$HOME/.wasmtime/bin"
          tar -xJf "$archive" \
            -C "$HOME/.wasmtime/bin" \
            --strip-components=1 \
            "${asset}/wasmtime"
      - name: Verify wasmtime version
        run: |
          set -euo pipefail
          expected_version="${WASMTIME_VERSION#v}"
          actual_output="$("$HOME/.wasmtime/bin/wasmtime" --version)"
          actual_version="${actual_output#wasmtime }"
          actual_version="${actual_version%% *}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "expected wasmtime ${expected_version}, got: ${actual_output}" >&2
            exit 1
          fi
          echo "$actual_output"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Rule evaluator wasm32 compile check (ADR-101 D5)
        run: cargo check --locked -p khive-rule-evaluator --target wasm32-unknown-unknown
      - name: Rule evaluator native suite and result transcripts
        run: |
          set -o pipefail
          cargo test --locked -p khive-rule-evaluator -- --nocapture --test-threads=1 2>&1 | tee /tmp/rules-native.log
      - name: Rule evaluator wasm32-wasip1 suite and result transcripts
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --wasi preview2 --"
        run: |
          set -o pipefail
          cargo test --locked -p khive-rule-evaluator --target wasm32-wasip1 -- --nocapture --test-threads=1 2>&1 | tee /tmp/rules-wasm.log
      - name: Assert full rule-result bytes match on native and wasm32
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          prefix = "RULE_EVALUATOR_GOLDEN:"
          expected = {"full", "partial"}

          def transcripts(log):
              rows = [line for line in log.splitlines() if line.startswith(prefix)]
              if len(rows) != 2:
                  raise ValueError("expected exactly two nonempty result transcripts")
              values = {}
              for line in rows:
                  label, payload = line[len(prefix):].split(":", 1)
                  if label in values or label not in expected:
                      raise ValueError("duplicate or unexpected result transcript")
                  decoded = json.loads(payload)
                  if not isinstance(decoded, list) or not decoded:
                      raise ValueError("empty or invalid result transcript")
                  values[label] = payload
              if set(values) != expected:
                  raise ValueError("missing named result transcript")
              return values

          def compare(native, wasm):
              if transcripts(native) != transcripts(wasm):
                  raise ValueError("native and wasm32 rule-result bytes differ")

          native = Path("/tmp/rules-native.log").read_text()
          wasm = Path("/tmp/rules-wasm.log").read_text()
          compare(native, wasm)
          # Comparator controls: status-only, missing and two-empty captures
          # must never make a parity gate vacuously pass.
          changed = native.replace('"passed":false', '"passed":true', 1)
          if changed == native:
              raise ValueError("fixture lost its failing-rule positive control")
          missing = "\n".join(line for line in native.splitlines()
                              if not line.startswith(prefix + "partial:"))
          for left, right in [(native, changed), (native, missing), ("", "")]:
              try:
                  compare(left, right)
              except ValueError:
                  pass
              else:
                  raise AssertionError("parity comparator accepted a negative control")
          print("native and wasm32: two complete rule-result JSON transcripts match")
          PY

      - name: wasm32-unknown-unknown compile check (ADR-101 D5)
        run: cargo check -p khive-changeset --target wasm32-unknown-unknown
      # ADR-101 D5 requires CI to run the SAME test suite against native and
      # wasm32 and fail on any divergence. wasm32-unknown-unknown has no
      # standalone test-execution story (no stdout/process without extra JS
      # tooling this repo does not otherwise depend on), so the actual
      # execution leg runs under wasm32-wasip1 via a wasmtime runner — real
      # wasm32 execution, not a native-only substitute. See crate README.md.
      - name: Native test run
        run: |
          set -o pipefail
          cargo test -p khive-changeset 2>&1 | tee /tmp/native.log
      - name: wasm32-wasip1 test run
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --wasi preview2 --"
        run: |
          set -o pipefail
          cargo test -p khive-changeset --target wasm32-wasip1 2>&1 | tee /tmp/wasm.log
      - name: Assert native/wasm32 test-suite parity
        run: |
          grep -E '^test .* \.\.\. (ok|FAILED)$' /tmp/native.log | sort > /tmp/native.sorted
          grep -E '^test .* \.\.\. (ok|FAILED)$' /tmp/wasm.log | sort > /tmp/wasm.sorted
          if [ ! -s /tmp/native.sorted ]; then
            echo "native run produced no parsed 'test ... ok/FAILED' lines" >&2
            exit 1
          fi
          if ! diff -u /tmp/native.sorted /tmp/wasm.sorted; then
            echo "native and wasm32-wasip1 test results diverge (see diff above)" >&2
            exit 1
          fi
          echo "native and wasm32-wasip1: $(wc -l < /tmp/native.sorted) tests, identical pass/fail results"

      # Pure graph-state diff uses the same native/WASM suite, plus a separate
      # nocapture invocation of its golden fixture for actual result-byte parity.
      - name: Graph diff wasm32-unknown-unknown build (ADR-101 D5)
        run: cargo build --locked -p khive-graph-diff --target wasm32-unknown-unknown
      - name: Graph diff native suite and golden bytes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p khive-graph-diff --test graph_diff -- --test-threads=1 2>&1 | tee /tmp/graph-diff-native.log
          cargo test --locked -p khive-graph-diff --test graph_diff parity_golden -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/graph-diff-native-golden.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/graph-diff-native-golden.log" 1
      - name: Graph diff wasm32-wasip1 suite and golden bytes
        shell: bash
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime run --wasi preview2 --"
        run: |
          set -euo pipefail
          cargo test --locked -p khive-graph-diff --test graph_diff --target wasm32-wasip1 -- --test-threads=1 2>&1 | tee /tmp/graph-diff-wasm.log
          cargo test --locked -p khive-graph-diff --test graph_diff --target wasm32-wasip1 parity_golden -- --exact --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/graph-diff-wasm-golden.log"
          ../scripts/assert-tests-ran.sh "$RUNNER_TEMP/graph-diff-wasm-golden.log" 1
      - name: Assert graph diff suite and result-byte parity
        run: |
          set -euo pipefail
          for platform in native wasm; do
            grep -E '^test .* \.\.\. (ok|FAILED)$' "/tmp/graph-diff-${platform}.log" | sort > "/tmp/graph-diff-${platform}.sorted"
            test -s "/tmp/graph-diff-${platform}.sorted"
            grep '^GRAPH_DIFF_PARITY:' "$RUNNER_TEMP/graph-diff-${platform}-golden.log" > "/tmp/graph-diff-${platform}.bytes"
          done
          diff -u /tmp/graph-diff-native.sorted /tmp/graph-diff-wasm.sorted
          assert_graph_diff_bytes() {
            test "$(wc -l < "$1")" -eq 2 || return 1
            test "$(wc -l < "$2")" -eq 2 || return 1
            cmp -s "$1" "$2"
          }
          assert_graph_diff_bytes /tmp/graph-diff-native.bytes /tmp/graph-diff-wasm.bytes
          # The exact comparator used above must reject changed result bytes,
          # missing fixtures and a vacuous pair of empty transcripts.
          sed '1s/$/ /' /tmp/graph-diff-wasm.bytes > /tmp/graph-diff-mutated.bytes
          head -n 1 /tmp/graph-diff-wasm.bytes > /tmp/graph-diff-missing.bytes
          : > /tmp/graph-diff-empty.bytes
          for invalid in mutated missing empty; do
            if assert_graph_diff_bytes /tmp/graph-diff-native.bytes "/tmp/graph-diff-${invalid}.bytes"; then
              echo "graph diff parity accepted ${invalid} fixture bytes" >&2
              exit 1
            fi
          done
          if assert_graph_diff_bytes /tmp/graph-diff-empty.bytes /tmp/graph-diff-empty.bytes; then
            echo "graph diff parity accepted empty fixture transcripts" >&2
            exit 1
          fi

  vamana-portability:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}vamana portability (ADR-110 Layer A)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
