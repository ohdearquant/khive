  minio-blob-compat:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}MinIO BlobStore compatibility (ADR-111 Amendment 2)
    needs: [resolve-revision, changed-paths]
    if: needs.changed-paths.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-revision.outputs.checkout_sha }}
      # Gate on storage-layer changes only: the MinIO leg (server build and
      # start) is the slowest part of this job, and most PRs never touch the
      # blob store. A change to this workflow file also runs it, so an edit to
      # the leg itself is exercised by its own pull request. `git diff` against the PR base (or the pushed range
      # on a direct push) decides whether the rest of the job runs at all.
      - name: Determine whether storage crates changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac
          # A depth-one checkout usually lacks the PR base or push predecessor.
          # Fetch only that commit; manual/new-branch runs keep the safe fallback.
          if [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]] \
             && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then
              echo "base fetch failed -- checking whether it is available locally"
            fi
          fi
          if ! [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no comparable base SHA -- running the MinIO leg to be safe"
            exit 0
          fi
          # Ask Git about watched paths directly: --name-only C-quotes unusual
          # filenames, which makes line-based prefix matching miss them. With
          # --no-renames, moving a file out of a watched directory still counts
          # its old path. A failed comparison also runs the leg to be safe.
          if git diff --quiet --no-renames "$base" HEAD -- \
            ':(top)crates/khive-db/' \
            ':(top)crates/khive-storage/' \
            ':(top,glob)docs/adr/ADR-111*' \
            ':(top).github/workflows/ci.yml' \
            ':(top)crates/Cargo.toml' \
            ':(top)crates/Cargo.lock'; then
            run=false
          else
            run=true
          fi
          echo "storage path comparison ${base}..HEAD: run=${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95.0
        if: steps.changed.outputs.run == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # MinIO no longer publishes prebuilt server images or binaries that an
      # anonymous CI job can fetch. quay.io answers 401 for minio/minio (its
      # tags and the digest this job used to pin), dl.min.io answers 410 Gone
      # for the server and client downloads, and Docker Hub has refused
      # anonymous pulls since 2026-09-11. The server is therefore built from
      # source at its last release. The tag is checked against its commit, so
      # a moved tag fails the job instead of changing the server under test.
      # The compiler is pinned the same way: the installer action by commit
      # SHA, the Go version to the release's own toolchain line, and the build
      # refuses to switch toolchains or edit module metadata. Go module
      # checksums pin every dependency, and a restored module cache is
      # verified against them before the build reads it.
      - name: Fetch pinned MinIO source
        if: steps.changed.outputs.run == 'true'
        working-directory: .
        run: |
          git clone --quiet --depth 1 --branch RELEASE.2025-10-15T17-29-55Z \
            https://github.com/minio/minio.git .minio-src
          test "$(git -C .minio-src rev-parse HEAD)" = 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
          grep -qx 'toolchain go1.24.8' .minio-src/go.mod
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.run == 'true'
        with:
          go-version: '1.24.8'
          check-latest: false
          cache-dependency-path: .minio-src/go.sum
      - name: Build and start MinIO
        if: steps.changed.outputs.run == 'true'
        working-directory: .minio-src
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          MINIO_ROOT_USER: khive-ci
          MINIO_ROOT_PASSWORD: khive-ci-secret
        run: |
          test "$(go env GOVERSION)" = go1.24.8
          go mod verify
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/minio" .
          # The health probe below must reach the server started here, so the
          # port has to be free before it starts, and once the probe answers the
          # process has to be alive and has to own the listening socket.
          if curl -s --connect-timeout 5 --max-time 10 -o /dev/null http://127.0.0.1:9000/; then
            echo "127.0.0.1:9000 already answers before MinIO starts" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/minio.pid"
          for _ in $(seq 1 30); do
            if curl -sf --connect-timeout 5 --max-time 10 http://127.0.0.1:9000/minio/health/live >/dev/null; then
              pid="$(cat "$RUNNER_TEMP/minio.pid")"
              kill -0 "$pid"
              ss -Hltnp 'sport = :9000' | grep -F "pid=$pid,"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy in time" >&2
          cat "$RUNNER_TEMP/minio.log" || true
          exit 1
      # The bucket is created with a SigV4-signed PUT, so the job needs no
      # MinIO client binary.
      - name: Create the conformance bucket
        if: steps.changed.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: khive-ci
          AWS_SECRET_ACCESS_KEY: khive-ci-secret
        run: |
          curl -sSf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            http://127.0.0.1:9000/khive-blob-conformance
      - name: Shared BlobStore conformance suite against MinIO
        if: steps.changed.outputs.run == 'true'
        env:
          KHIVE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          KHIVE_S3_TEST_BUCKET: khive-blob-conformance
          KHIVE_S3_TEST_REGION: us-east-1
          AWS_ACCESS_KEY_ID: khive-ci
          AWS_SECRET_ACCESS_KEY: khive-ci-secret
        run: cargo test -p khive-db --features blob-s3 --test blob_conformance
      # The suite counts only if the server started above served all of it:
      # the same process must still be alive and still own the port.
      - name: Confirm the suite ran against the started server
        if: steps.changed.outputs.run == 'true'
        working-directory: .
        run: |
          pid="$(cat "$RUNNER_TEMP/minio.pid")"
          kill -0 "$pid"
          ss -Hltnp 'sport = :9000' | grep -F "pid=$pid,"
      - name: Stop MinIO
        if: always() && steps.changed.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" || true
          fi

  msrv-check:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.main_sha != '' && 'Replay ' || '' }}MSRV compile check
