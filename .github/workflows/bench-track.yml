name: Bench Trend Tracking

# Trend tracking for component (Criterion) and e2e (pipeline / bench-1m
# synthetic) benchmarks. Metric values are advisory: they are appended to
# run-local bench-data/<suite>.jsonl on `perf-data` (numbered shards for
# components) and rendered without performance thresholds. Component compile
# failures, benchmark panics and timeouts fail
# their job after the ledger and raw artifacts have had a chance to publish.
#
# Efficiency and coverage:
#   - PRs run only affected Criterion components. The stable component jobs
#     resolve as skipped when their crate/hotpath mapping has no changes, so
#     required checks never disappear behind workflow-level path filtering.
#   - A push of a merge train (integration/train-*) runs the components that
#     hold a benchmarked crate in the train's dependents closure, once for the
#     whole train, and never publishes (ADR-206 Amendment 1).
#   - The full component + e2e suite runs on the daily schedule, on
#     dispatch and on release tags. Criterion remains quick-profile and
#     wall-clock bounded.
#   - A single repository variable (`BENCH_TRACK_DISABLED`) skips all bench
#     work while leaving the PR change-detection check visible.

on:
  # The trend ledger takes one data point per day at the main head, plus one per
  # release tag. A data point per merge had no reader during a merge burst and held
  # runners that pull request checks were waiting for. Dispatch on main records an
  # extra point on demand; dispatch from any other ref runs the benches without
  # publishing.
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
  # A merge train's integration branch runs its dependents closure once before the train merges; it
  # records nothing (the publish steps run on main and release tags only).
  push:
    branches: ["integration/train-*"]
    tags: ["v*"]
  # Do not path-filter the workflow itself: a required selector check must be
  # created even when every component resolves to skipped.
  pull_request:

# Workflow-level default is read-only. `contents: write` is granted only to
# component/e2e jobs that may push to `perf-data`; PR tokens remain subject to
# GitHub's normal fork permission downgrade, and PR component jobs never call
# the publisher.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PERF_DATA_BRANCH: perf-data
  BENCH_BOT_NAME: khive-bench-bot
  BENCH_BOT_EMAIL: khive-bench-bot@users.noreply.github.com

concurrency:
  # A scheduled, dispatched or release run owns a SHA-specific group so one
  # cannot replace another's pending data point. The publisher already retries
  # perf-data push races. Exhausted races are advisory incidents. PR runs
  # stay ref-grouped and superseded measurements may be cancelled to avoid
  # wasting runners.
  group: bench-track-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # PR component selector. The first four components each own the five crates
  # from one old shard; runtime-mcp and gate-channel-code hold the crates whose
  # benchmarks landed later, and a component job runs only the crates that
  # have a bench target. The explicit shared files are registered benchmark
  # hotpaths: a change to the workspace graph, tracker/publisher, or workflow
  # can affect every component. An unmatched PR path sets no component output,
  # and every component job skips without doing setup or bench work.
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    name: Select changed benchmark components
    # Pull requests from this repository's codex/ branches skip this job, and with it every
    # component job; the push of the merge train that carries them benchmarks their closure.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # The train step fetches a binary and ingests the workspace map; its own steps are bounded below it.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      # true when the component outputs below decide which components run (a pull request or a train
      # push); every other event runs them all.
      selective: ${{ steps.paths.outputs.selective }}
      scoring_retrieval: ${{ steps.paths.outputs.scoring_retrieval }}
      ann_query: ${{ steps.paths.outputs.ann_query }}
      storage_brain: ${{ steps.paths.outputs.storage_brain }}
      packs: ${{ steps.paths.outputs.packs }}
      runtime_mcp: ${{ steps.paths.outputs.runtime_mcp }}
      gate_channel_code: ${{ steps.paths.outputs.gate_channel_code }}

    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/train-'))
        with:
          fetch-depth: 0

      # A train push classifies the train's whole range, from its merge base with main to its tip, the
      # way the CI workflow's Scope step classifies a pull request (scripts/ci-test-scope.py): the path
      # rules first, then the kkernel binary that the newest successful push run on main published. The
      # lines from `mode=` to the end of the binary lookup are the Scope step's own (a workflow test
      # compares them). This step always writes test_scope and never fails: every error and every
      # timeout writes `full`.
      - name: Scope the train
        id: train
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/train-')
        env:
          HEAD_SHA: ${{ github.sha }}
          MAIN_REF: origin/main
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          classifiers_changed() {
            local changed
            if [[ -z "$1" ]] || ! changed=$(git diff --name-only "$1" "$HEAD_SHA" -- scripts/ci-docs-only.sh scripts/ci-test-scope.py \
              scripts/ci-inert-docs-data.txt tests/documented_verb_counts.py); then
              echo "full suite: the path classifiers could not be compared with $1"
              return 0
            fi
            if [[ -n "$changed" ]]; then
              echo "full suite: the change edits a path classifier: ${changed//$'\n'/, }"
              return 0
            fi
            return 1
          }
          test_scope=full
          if ! base=$(git merge-base "$MAIN_REF" "$HEAD_SHA"); then
            echo "full set: no merge base between $MAIN_REF and $HEAD_SHA"
          else
            echo "train range: $base..$HEAD_SHA"
            classifier_base="$base"
            if [[ -n "$base" ]] && classifiers_changed "$classifier_base"; then
              base=""
            fi
            if [[ -n "$base" ]]; then
              mode=$(timeout 60 python3 -P scripts/ci-test-scope.py "$base" "$HEAD_SHA" --paths-only) || mode=full
            else
              mode=full
            fi
            if [[ "$mode" == "map" ]]; then
              binary=""
              runs=$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=10" \
                --jq '.workflow_runs[].id') || runs=""
              for run_id in $runs; do
                dir="$RUNNER_TEMP/kkernel-main-$run_id"
                if timeout 120 gh run download "$run_id" -R "$REPOSITORY" -n kkernel-debug-linux -D "$dir" \
                    && [[ -f "$dir/kkernel" ]]; then
                  chmod +x "$dir/kkernel"
                  binary="$dir/kkernel"
                  echo "kkernel from main push run $run_id"
                  break
                fi
              done
              if [[ -z "$binary" ]]; then
                echo "full suite: no successful main push run among the newest 10 published kkernel-debug-linux"
              else
                test_scope=$(timeout 300 python3 -P scripts/ci-test-scope.py "$base" "$HEAD_SHA" --kkernel "$binary") \
                  || test_scope=full
              fi
            fi
          fi
          if [[ -z "$test_scope" ]]; then
            test_scope=full
          fi
          echo "test_scope=$test_scope" | tee -a "$GITHUB_OUTPUT"

      - name: Map changed paths to components
        id: paths
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/train-'))
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRAIN_SCOPE: ${{ steps.train.outputs.test_scope }}
        run: |
          set -euo pipefail
          scoring_retrieval=false
          ann_query=false
          storage_brain=false
          packs=false
          runtime_mcp=false
          gate_channel_code=false
          all_components=false

          # Fail closed: a process-substitution `< <(git diff ...)` failure is
          # invisible to `set -euo pipefail` (the subshell's exit status never
          # reaches the script). Capture the diff to a file first and check
          # its exit status explicitly, so an unavailable/malformed base or
          # head object trips all_components instead of silently leaving
          # every component flag false.
          diff_file="$(mktemp)"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # A train push maps the crates of its closure through the same table, as one path per crate.
            # Every benchmarked crate's directory is its package name (a workflow test checks this).
            if [ -z "$TRAIN_SCOPE" ] || [ "$TRAIN_SCOPE" = "full" ]; then
              echo "train scope: full"
              all_components=true
            else
              echo "train scope: $TRAIN_SCOPE"
              for crate in $TRAIN_SCOPE; do
                echo "crates/$crate/Cargo.toml"
              done > "$diff_file"
            fi
          elif ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$diff_file"; then
            echo "::warning::git diff failed for $BASE_SHA...$HEAD_SHA; treating as all-components (fail closed)"
            all_components=true
          fi

          # An empty diff for two distinct SHAs is also unsafe: it should
          # never happen for a real PR range, so treat it the same as a
          # diff failure rather than silently skipping every component.
          if [ "$all_components" != true ] && [ ! -s "$diff_file" ] && [ "$BASE_SHA" != "$HEAD_SHA" ]; then
            echo "::warning::git diff returned no output for distinct SHAs $BASE_SHA...$HEAD_SHA; treating as all-components (fail closed)"
            all_components=true
          fi

          if [ "$all_components" != true ]; then
            while IFS= read -r path; do
              case "$path" in
                crates/khive-score/*|crates/khive-fusion/*|crates/khive-retrieval/*|crates/khive-text/*|crates/khive-bm25/*)
                  scoring_retrieval=true
                  ;;
                crates/khive-hnsw/*|crates/khive-vamana/*|crates/khive-quant/*|crates/khive-query/*|crates/khive-request/*)
                  ann_query=true
                  ;;
                crates/khive-db/*|crates/khive-fold/*|crates/khive-brain-core/*|crates/khive-pack-brain/*|crates/khive-pack-comm/*)
                  storage_brain=true
                  ;;
                crates/khive-pack-gtd/*|crates/khive-pack-kg/*|crates/khive-pack-knowledge/*|crates/khive-pack-memory/*|crates/khive-pack-schedule/*)
                  packs=true
                  ;;
                crates/khive-runtime/*|crates/khive-mcp/*|crates/kkernel/*)
                  runtime_mcp=true
                  ;;
                crates/khive-gate/*|crates/khive-channel/*|crates/khive-pack-code/*|crates/khive-changeset/*|crates/khive-channel-email/*|crates/khive-graph-diff/*|crates/khive-wire-protocol/*)
                  gate_channel_code=true
                  ;;
                crates/Cargo.toml|crates/Cargo.lock|scripts/perf/bench_track.py|scripts/perf/bench_calibrate.py|scripts/perf/ledger_shards.py|scripts/perf/publish_ledger.sh|scripts/bench_1m.sh|.github/workflows/bench-track.yml|.github/workflows/bench-component.yml)
                  all_components=true
                  ;;
              esac
            done < "$diff_file"
          fi

          if [ "$all_components" = true ]; then
            scoring_retrieval=true
            ann_query=true
            storage_brain=true
            packs=true
            runtime_mcp=true
            gate_channel_code=true
          fi

          {
            echo "selective=true"
            echo "scoring_retrieval=$scoring_retrieval"
            echo "ann_query=$ann_query"
            echo "storage_brain=$storage_brain"
            echo "packs=$packs"
            echo "runtime_mcp=$runtime_mcp"
            echo "gate_channel_code=$gate_channel_code"
          } >> "$GITHUB_OUTPUT"

  component-scoring-retrieval:
    name: Component benches / scoring-retrieval
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.scoring_retrieval == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: scoring-retrieval
      crates: khive-score khive-fusion khive-retrieval khive-text khive-bm25

  component-ann-query:
    name: Component benches / ann-query
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.ann_query == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: ann-query
      crates: khive-hnsw khive-vamana khive-quant khive-query khive-request

  component-storage-brain:
    name: Component benches / storage-brain
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.storage_brain == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: storage-brain
      crates: khive-db khive-fold khive-brain-core khive-pack-brain khive-pack-comm

  component-packs:
    name: Component benches / packs
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.packs == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: packs
      crates: khive-pack-gtd khive-pack-kg khive-pack-knowledge khive-pack-memory khive-pack-schedule
      # Reserve 25 minutes for compilation, ten for Criterion, and five for
      # setup, bounded termination and publishing even after a phase times out.
      timeout_minutes: 40

  # The crates of these two components are gaining their first benchmark targets one change at a
  # time; until a crate has one, the component job leaves it out (bench-component.yml).
  component-runtime-mcp:
    name: Component benches / runtime-mcp
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.runtime_mcp == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: runtime-mcp
      crates: khive-runtime khive-mcp kkernel
      timeout_minutes: 40

  component-gate-channel-code:
    name: Component benches / gate-channel-code
    needs: changes
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' &&
      (needs.changes.outputs.selective != 'true' || needs.changes.outputs.gate_channel_code == 'true')
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/bench-component.yml
    with:
      component: gate-channel-code
      crates: khive-gate khive-channel khive-pack-code khive-changeset khive-channel-email khive-graph-diff khive-wire-protocol
      timeout_minutes: 40

  # ─────────────────────────────────────────────────────────────────────────
  # e2e benches: the pipeline daemon suite (bench_calibrate's `pipeline`
  # extractor, reused not duplicated) plus the hermetic bench-1m synthetic
  # gate, run once as an informational data point. Advisory ledgers:
  # bench-data/pipeline.jsonl, bench-data/bench-1m.jsonl
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E benches (pipeline + bench-1m synthetic)
    runs-on: ubuntu-latest
    # A train push runs the components only; the daily run carries the e2e suite.
    if: >-
      vars.BENCH_TRACK_DISABLED != 'true' && github.event_name != 'pull_request' &&
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/'))
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Pin the real toolchain bin on PATH
        run: dirname "$(rustup which cargo)" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: astral-sh/setup-uv@v5

      - name: Build kkernel (bench-embedder feature)
        run: |
          set -euo pipefail
          cargo build --release -p kkernel --features bench-embedder --manifest-path crates/Cargo.toml
          cp crates/target/release/kkernel crates/target/release/kkernel-bench

      - name: Record pipeline suite (single informational run)
        id: record_pipeline
        env:
          KKERNEL_BENCH_BINARY: crates/target/release/kkernel-bench
        # Captures bench_track.py's own exit code instead of failing the
        # step outright (this step failing before publish ran meant an
        # already-written error record never reached perf-data). See the
        # "Fail job" step at the end of this job.
        run: |
          set +e
          python3 scripts/perf/bench_track.py record \
            --suite pipeline \
            --source calibrate \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --data-dir bench-data \
            --summary-out /tmp/pipeline-trend.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run hermetic bench-1m synthetic gate (informational, --runs 1)
        id: bench_1m
        # Same hermetic synthetic path bench-1m.yml's blocking ann-ci-gate
        # uses (seed=42, no SIFT download) - runnable on standard runners,
        # so it runs here too, but only ever informational: this workflow
        # never asserts pass/fail on its output, only records it.
        #
        # bench_1m.sh exits 1 on a measured assertion regression (its own
        # blocking-gate behavior, reused here) - `set +e` + an explicit rc
        # capture (not `|| true`, which would discard the code entirely)
        # keeps this step green so the NEXT step (recording) always runs,
        # while still carrying the real exit code into the ledger as an
        # advisory field instead of silently dropping the regression.
        run: |
          set +e
          bash scripts/bench_1m.sh --ci-synthetic
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record bench-1m suite (single informational run)
        id: record_bench_1m
        run: |
          set +e
          python3 scripts/perf/bench_track.py record \
            --suite bench-1m \
            --source json \
            --json-file target/bench-out/SIFT-CI-synthetic.json \
            --sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --data-dir bench-data \
            --gate-exit-code "${{ steps.bench_1m.outputs.exit_code }}" \
            --summary-out /tmp/bench-1m-trend.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish ledgers to perf-data branch
        id: publish
        if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        continue-on-error: true
        run: bash scripts/perf/publish_ledger.sh bench-data/pipeline.jsonl bench-data/bench-1m.jsonl

      - name: Write step summary
        if: always()
        run: |
          cat /tmp/pipeline-trend.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat /tmp/bench-1m-trend.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload raw e2e output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-track-e2e-${{ github.run_id }}
          path: |
            perf/pipeline-ledger.csv
            target/bench-out/SIFT-CI-synthetic.json
            perf/ci-synthetic-ledger.csv
            bench-data/pipeline.jsonl
            bench-data/bench-1m.jsonl
          retention-days: 90
          if-no-files-found: ignore

      - name: Warn if trend ledger publish failed (advisory, never fails)
        if: ${{ !cancelled() && (steps.publish.outputs.publish_status == 'failed' || steps.publish.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          MSG="perf-data publish failed for e2e benches; pipeline and bench-1m ledger records are retained in the run artifact. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::warning::${MSG}"
          {
            echo "## Trend ledger publish failed (advisory)"
            echo ""
            echo "${MSG}"
          } >> "$GITHUB_STEP_SUMMARY"
          TRACKING_ISSUE=863
          gh issue reopen "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          if ! gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MSG"; then
            echo "::warning::tracking-issue comment failed (non-fatal)"
          fi
          exit 0

      # Advisory-lane semantics: see the components job note above. Exit 0.
      - name: Warn if trend ledger record errored (advisory, never fails)
        if: ${{ !cancelled() && (steps.record_pipeline.outputs.exit_code != '0' || steps.record_bench_1m.outputs.exit_code != '0') }}
        env:
          PIPELINE_EXIT_CODE: ${{ steps.record_pipeline.outputs.exit_code }}
          BENCH_1M_RECORD_EXIT_CODE: ${{ steps.record_bench_1m.outputs.exit_code }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.publish_status }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "$PUBLISH_STATUS" = failed ] || [ "$PUBLISH_OUTCOME" = failure ]; then
            LEDGER_NOTE="status=error record(s) are retained in the run artifact; perf-data publish failed."
          else
            LEDGER_NOTE="status=error record(s) were still published to perf-data."
          fi
          MSG="bench_track.py record failed: pipeline exit=${PIPELINE_EXIT_CODE} bench-1m exit=${BENCH_1M_RECORD_EXIT_CODE}; ${LEDGER_NOTE} Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "::warning::${MSG}"
          {
            echo "## Trend ledger record errored (advisory)"
            echo ""
            echo "${MSG}"
          } >> "$GITHUB_STEP_SUMMARY"
          TRACKING_ISSUE=863
          if ! gh issue reopen "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "tracking issue already open or reopen unavailable (non-fatal)"
          fi
          if ! gh issue comment "$TRACKING_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MSG"; then
            echo "::warning::tracking-issue comment failed (non-fatal)"
          fi
          exit 0
