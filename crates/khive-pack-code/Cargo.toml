[package]
name = "khive-pack-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Code ontology pack - typed edge rules and audit findings vocabulary"

[dependencies]
khive-types = { version = "0.9.0", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.9.0", path = "../khive-runtime" }
khive-storage = { version = "0.9.0", path = "../khive-storage" }
tokio = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }

[dev-dependencies]
khive-pack-kg = { version = "0.9.0", path = "../khive-pack-kg" }
tokio = { workspace = true, features = ["full"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
