[package]
name = "khive-pack-knowledge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Knowledge verb pack — concept registration, citation, and topic search"

[dependencies]
khive-types = { version = "0.2.2", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.2.2", path = "../khive-runtime" }
khive-storage = { version = "0.2.2", path = "../khive-storage" }
inventory = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
khive-pack-kg = { version = "0.2.2", path = "../khive-pack-kg" }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
