[package]
name = "khive-pack-moodboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Experimental Khive-native visual retrieval and pairwise preference learning"

[dependencies]
khive-retrieval = { version = "0.16.0", path = "../khive-retrieval" }
khive-fusion = { version = "0.16.0", path = "../khive-fusion" }
khive-score = { version = "0.16.0", path = "../khive-score" }
khive-fs = { version = "0.16.0", path = "../khive-fs" }
khive-types = { version = "0.16.0", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.16.0", path = "../khive-runtime" }
khive-storage = { version = "0.16.0", path = "../khive-storage" }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true, features = ["std"] }
image = { workspace = true }
inventory = { workspace = true }
lattice-embed = { workspace = true }
lattice-inference = { workspace = true }
lattice-fann = { workspace = true }
# Not imported. These pin, to the exact version the descriptor records, every lattice
# crate that lattice-embed, lattice-inference and lattice-fann resolve to, so the published
# pack graph cannot float the descriptor math under an unchanged fingerprint.
lattice-arch = { workspace = true }
lattice-compute = { workspace = true }
lattice-forecast = { workspace = true }
lattice-grammar = { workspace = true }
lattice-inference-core = { workspace = true }
lattice-lora = { workspace = true }
lattice-model-bert = { workspace = true }
lattice-model-embeddinggemma2 = { workspace = true }
lattice-model-io = { workspace = true }
lattice-model-qwen3-embedding = { workspace = true }
lattice-model-qwen35 = { workspace = true }
lattice-quant = { workspace = true }
lattice-router = { workspace = true }
lattice-simd = { workspace = true }
lattice-tokenizer = { workspace = true }
lattice-weights = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
khive-db = { version = "0.16.0", path = "../khive-db", features = ["test-support"] }
khive-pack-kg = { version = "0.16.0", path = "../khive-pack-kg" }
toml = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
