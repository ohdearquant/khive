[package]
name = "khive-channel-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Node wire protocol v1 cryptography, encodings, and HTTPS client"
# Built from this workspace and vendored by path; not on the crates.io publish ladder yet.
publish = false

[dependencies]
khive-channel = { version = "0.15.0", path = "../khive-channel" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
# HPKE disables dalek defaults: enable zeroization for its static secrets too.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.0"
async-trait = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
httpdate = "=1.0.3"

[dev-dependencies]
tracing-subscriber = { workspace = true }
ring = "=0.17.14"
curve25519-dalek = { version = "=4.1.3", default-features = false }
