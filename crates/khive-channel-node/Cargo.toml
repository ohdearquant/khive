[package]
name = "khive-channel-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Node wire protocol v1 cryptography and strict message encodings"

[dependencies]
khive-channel = { path = "../khive-channel", version = "0.9.0" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
# HPKE disables dalek defaults: enable zeroization for its static secrets too.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
ring = "=0.17.14"
curve25519-dalek = { version = "=4.1.3", default-features = false }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = "=1.9.0"
