[package]
name = "khive-pack-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Web pack: site/page/resource ontology and fetch/extract/ingest/search/refresh verbs (ADR-191)"

[dependencies]
khive-types = { version = "0.11.0", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.11.0", path = "../khive-runtime" }
khive-storage = { version = "0.11.0", path = "../khive-storage" }
khive-db = { version = "0.11.0", path = "../khive-db" }
khive-fs = { version = "0.11.0", path = "../khive-fs" }
inventory = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
url = "2"
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
khive-db = { version = "0.11.0", path = "../khive-db", features = ["test-support"] }
khive-pack-kg = { version = "0.11.0", path = "../khive-pack-kg" }
lattice-embed = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
flate2 = "1"
