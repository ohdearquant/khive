[package]
name = "khive-retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hybrid retrieval composer (HNSW + BM25 + fusion + graph + cross-encoder) with deterministic scoring"

[lib]
bench = false

[dependencies]
khive-hnsw    = { version = "0.9.0", path = "../khive-hnsw", optional = true }
khive-bm25    = { version = "0.9.0", path = "../khive-bm25", optional = true }
khive-fusion  = { version = "0.9.0", path = "../khive-fusion" }
khive-score   = { version = "0.9.0", path = "../khive-score" }
khive-types   = { version = "0.9.0", path = "../khive-types" }
khive-fold    = { version = "0.9.0", path = "../khive-fold", optional = true }
khive-storage = { version = "0.9.0", path = "../khive-storage", optional = true }
khive-gate    = { version = "0.9.0", path = "../khive-gate", optional = true }
lattice-embed = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true, optional = true }

[features]
# No optional features are enabled by default, as specified by ADR-030.
default = []
# Re-exports the khive-hnsw index types (HnswIndex, HnswConfig, ...) at the crate root
hnsw = ["dep:khive-hnsw"]
# Re-exports the khive-bm25 index types (Bm25Index, Bm25Config, ...) at the crate root
bm25 = ["dep:khive-bm25"]
# Policy-based access control for search results (uses khive-gate API)
policy = ["khive-gate"]
# HNSW checkpoint integration with khive-fold (ADR-030 F167)
# Enables HnswCheckpoint/HnswCheckpointStore re-exports and khive-hnsw checkpoint support.
checkpoint = ["hnsw", "khive-fold", "khive-hnsw/checkpoint"]
# Adapters bridging khive-storage backends (sqlite-vec, FTS5) to retrieval search traits.
# The adapter tests get sqlite-vec from the khive-db dev-dependency's vectors feature.
storage-adapters = ["khive-storage"]
# Native cross-encoder reranking (deferred until khive-inference is ported)
native-rerank = []
# Native embedding service (delegated to lattice-embed; reserved for future feature-gating)
embed = []
# Hidden helpers shared by the packs that keep file-backed ANN checkpoints: the checkpoint
# directory lock, the rotation watcher loop and the consumer registry. The registry runs its
# SQL through khive-storage and logs through tracing.
ann = ["khive-storage", "tracing"]

[dev-dependencies]
criterion = { workspace = true }
khive-score = { version = "0.9.0", path = "../khive-score" }
khive-fusion = { version = "0.9.0", path = "../khive-fusion" }
# Only the storage-adapters and ann registry tests use khive-db; `vectors` loads sqlite-vec.
khive-db = { version = "0.9.0", path = "../khive-db", features = ["vectors"] }

[[bench]]
name = "fusion_bench"
path = "benches/fusion_bench.rs"
harness = false
