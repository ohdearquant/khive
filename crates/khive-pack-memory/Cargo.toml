[package]
name = "khive-pack-memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Memory verb pack — remember/recall semantics with decay-aware ranking"

[dependencies]
khive-types = { version = "0.2.1", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.2.1", path = "../khive-runtime" }
khive-pack-brain = { version = "0.2.1", path = "../khive-pack-brain" }
inventory = { workspace = true }
khive-storage = { version = "0.2.1", path = "../khive-storage" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
khive-pack-kg = { version = "0.2.1", path = "../khive-pack-kg" }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
