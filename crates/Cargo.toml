[workspace]
resolver = "2"
members = [
    "khive-types",
    "khive-score",
    "khive-fold",
    "khive-storage",
    "khive-db",
    "khive-query",
    "khive-gate",
    "khive-gate-rego",
    "khive-fusion",
    "khive-bm25",
    "khive-runtime",
    "khive-request",
    "khive-pack-kg",
    "khive-pack-gtd",
    "khive-pack-memory",
    "khive-pack-brain",
    "khive-mcp",
    "khive-vcs",
    "kkernel",
]
# khive-merge excluded — forward-deployed (ADR-043) but not yet compilable
# against restructured khive-vcs. Will be re-added when ADR-043 integrates.

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Ocean <ocean@lionagi.ai>"]
license = "Apache-2.0"
repository = "https://github.com/ohdearquant/khive"
homepage = "https://khive.ai"
keywords = ["knowledge-graph", "semantic-search", "mcp", "ai-tools", "graph-database"]
categories = ["database", "command-line-utilities"]

[workspace.dependencies]
inventory = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
lattice-embed = "0.1.2"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
