[package]
name = "khive-pack-comm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Communication pack — inter-agent messaging (send, inbox, read, reply, thread) (ADR-040)"

[lib]
bench = false

[dependencies]
khive-types = { version = "0.15.0", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.15.0", path = "../khive-runtime" }
khive-storage = { version = "0.15.0", path = "../khive-storage" }
inventory = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
khive-channel-node = { version = "0.15.0", path = "../khive-channel-node", optional = true }

[features]
# Concrete node channel route, persisted sources and shared host state.
node = ["dep:khive-channel-node", "khive-channel-node/macos-keychain"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
khive-pack-kg = { version = "0.15.0", path = "../khive-pack-kg" }
khive-db = { version = "0.15.0", path = "../khive-db", features = ["test-support"] }
criterion = { workspace = true }
toml = { workspace = true }
khive-runtime = { version = "0.15.0", path = "../khive-runtime", features = ["fault-injection", "test-internals"] }
lattice-embed = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "column_decltype"] }
tempfile = { workspace = true }
serial_test = { workspace = true }

[[bench]]
name = "comm_bench"
harness = false

[[bench]]
name = "comm_lifecycle"
harness = false
