[package]
name = "khive-pack-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Session verb pack - store/list/resume/export over the notes substrate"

[dependencies]
khive-types = { version = "0.11.0", path = "../khive-types", features = ["serde", "sha2"] }
khive-runtime = { version = "0.11.0", path = "../khive-runtime" }
inventory = { workspace = true }
khive-storage = { version = "0.11.0", path = "../khive-storage" }
khive-score = { version = "0.11.0", path = "../khive-score" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
khive-fs = { version = "0.11.0", path = "../khive-fs" }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
khive-storage = { version = "0.11.0", path = "../khive-storage", features = ["test-support"] }
tokio = { workspace = true, features = ["full"] }
lattice-embed = { workspace = true }
rusqlite = { workspace = true }
khive-pack-kg = { version = "0.11.0", path = "../khive-pack-kg" }
tempfile = { workspace = true }
# Test-only: builds a bare `PoolConfig { write_queue_enabled: true, .. }` +
# `SqlBridge` directly (no `KhiveRuntime`, no `KHIVE_WRITE_QUEUE` env var) for
# the ADR-099 D5 single-writer / suspend-free tests, matching the
# established pattern in khive-pack-brain's `fold_gate.rs` and `persist.rs`
# (documented there: env-var mutation races other tests' `KhiveRuntime::new`
# calls in the same binary; a literal `PoolConfig` sidesteps that).
khive-db = { version = "0.11.0", path = "../khive-db", features = ["test-support"] }
