[package]
name = "khive-fold"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cognitive primitives — Fold, Anchor, Objective, Selector"

[dependencies]
khive-score = { version = "0.2.0", path = "../khive-score" }
# ADR-024 target dependency boundary — khive-types added per F134
# blake3 feature enables Hash32::from_blake3 for checkpoint hashing (F-NEW-5)
khive-types = { version = "0.2.0", path = "../khive-types", features = ["blake3"] }
# serde/uuid/thiserror/chrono remain because FoldContext uses them (context.rs is out of F134 scope)
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# blake3 for checkpoint hash computation/verification (F-NEW-5)
blake3 = "1"
