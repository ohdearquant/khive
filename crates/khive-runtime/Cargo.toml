[package]
name = "khive-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Composable Service API: entity/note CRUD, graph traversal, hybrid search, curation."

[features]
fault-injection = []
test-internals = []

[dependencies]
khive-types = { version = "0.8.0", path = "../khive-types", features = ["serde", "blake3"] }
khive-storage = { version = "0.8.0", path = "../khive-storage" }
khive-score = { version = "0.8.0", path = "../khive-score" }
khive-fusion = { version = "0.8.0", path = "../khive-fusion" }
khive-fold = { version = "0.8.0", path = "../khive-fold" }
khive-db = { version = "0.8.0", path = "../khive-db", features = ["vectors"] }
khive-query = { version = "0.8.0", path = "../khive-query" }
khive-gate = { version = "0.8.0", path = "../khive-gate" }
inventory = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lattice-embed = { workspace = true }
parking_lot = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
unicode-general-category = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Self-dependency to enable `fault-injection` for integration tests under
# `tests/`: those link the lib as an external crate, so `#[cfg(test)]` items
# gated `any(test, feature = "fault-injection")` (e.g. `run_daemon_in_process_test`)
# are otherwise unreachable from there.
khive-runtime = { path = ".", features = ["fault-injection"] }
khive-gate-rego = { version = "0.8.0", path = "../khive-gate-rego" }
khive-storage = { version = "0.8.0", path = "../khive-storage", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
serial_test = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
