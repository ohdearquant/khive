[package]
name = "khive-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Composable Service API: entity/note CRUD, graph traversal, hybrid search, curation."

[features]
fault-injection = []
test-internals = []

[dependencies]
khive-types = { version = "0.8.0", path = "../khive-types", features = ["serde", "blake3"] }
khive-storage = { version = "0.8.0", path = "../khive-storage" }
khive-score = { version = "0.8.0", path = "../khive-score" }
khive-fusion = { version = "0.8.0", path = "../khive-fusion" }
khive-fold = { version = "0.8.0", path = "../khive-fold" }
khive-db = { version = "0.8.0", path = "../khive-db", features = ["vectors"] }
khive-query = { version = "0.8.0", path = "../khive-query" }
khive-gate = { version = "0.8.0", path = "../khive-gate" }
inventory = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lattice-embed = { workspace = true }
parking_lot = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }
anyhow = { workspace = true }
unicode-general-category = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# Self dev-dependency: requests this crate's own `fault-injection` and
# `test-internals` features for its `tests/` integration binaries. Cargo's
# feature unification means plain `cargo test -p khive-runtime` already
# builds and runs those feature-gated tests (e.g.
# `tests/adr133_audit_batch.rs`, `tests/read_verb_admission_exhaustion.rs`)
# with no extra `--features` flag.
khive-runtime = { path = ".", features = ["fault-injection", "test-internals"] }
khive-gate-rego = { version = "0.8.0", path = "../khive-gate-rego" }
khive-storage = { version = "0.8.0", path = "../khive-storage", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
serial_test = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
