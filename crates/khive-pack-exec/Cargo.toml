[package]
name = "khive-pack-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Exec pack - materialize a blob tree into a sandbox, run one registered tool under policy, capture outputs and changed files back to blobs with a receipt"

[dependencies]
khive-types = { version = "0.8.0", path = "../khive-types", features = ["serde"] }
khive-runtime = { version = "0.8.0", path = "../khive-runtime" }
khive-storage = { version = "0.8.0", path = "../khive-storage" }
khive-pack-tool = { version = "0.8.0", path = "../khive-pack-tool" }
inventory = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
khive-db = { version = "0.8.0", path = "../khive-db" }
khive-pack-kg = { version = "0.8.0", path = "../khive-pack-kg" }
khive-pack-blob = { version = "0.8.0", path = "../khive-pack-blob" }
tempfile = { workspace = true }
base64 = { workspace = true }
