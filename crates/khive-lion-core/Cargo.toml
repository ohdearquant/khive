[package]
edition = "2021"
name = "khive-lion-core"
version = "0.4.0"
authors = ["HaiyangLi <quantocean.li@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Lion microkernel — production types, state machine, and kernel API"
homepage = "https://github.com/ohdearquant/khive"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/ohdearquant/khive"

[features]
default = []
serde = ["dep:serde"]

[lib]
name = "lion_core"
path = "src/lib.rs"

[dependencies.hmac]
version = "0.12"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.sha2]
version = "0.10"

[dependencies.subtle]
version = "2.5"

[dependencies.thiserror]
version = "2.0"

[dev-dependencies.proptest]
version = "1.0"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(extract)"]
