[project]
name = "khive-py"
version = "0.2.0"
description = "Python client for the khive knowledge-graph database (khived daemon) and khive-cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.30", "starlette>=0.37"]
cloud = ["httpx>=0.27", "mcp>=1.2,<2"]

[project.scripts]
khive-cloud = "khive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khive"]

[tool.ruff]
line-length = 100
