[project]
name = "khive"
version = "0.12.0"
description = "Python client for the khive knowledge-graph runtime, with the kkernel binary bundled on supported platforms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.7"]

[project.scripts]
khive-cloud = "khive.cloud_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "blake3>=1", "uvicorn>=0.30", "starlette>=0.37"]
cloud = ["httpx>=0.27", "mcp>=1.2,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khive"]

[tool.ruff]
line-length = 100
