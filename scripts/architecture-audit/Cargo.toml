[package]
name = "architecture-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
publish = false

[workspace]

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
